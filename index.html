\" stroke-width=\"1.6\"/><circle cx=\"88.0\" cy=\"90.8\" r=\"9\" fill=\"#111111\" stroke=\"#111\" stroke-width=\"1.6\"/><circle cx=\"146.4\" cy=\"32.3\" r=\"9\" fill=\"#ffffff\" stroke=\"#111\" stroke-width=\"1.6\"/><circle cx=\"147.7\" cy=\"49.6\" r=\"9\" fill=\"#ffffff\" stroke=\"#111\" stroke-width=\"1.6\"/><circle cx=\"38.2\" cy=\"74.5\" r=\"9\" fill=\"#ffffff\" stroke=\"#111\" stroke-width=\"1.6\"/><circle cx=\"53.6\" cy=\"66.6\" r=\"9\" fill=\"#ffffff\" stroke=\"#111\" stroke-width=\"1.6\"/><circle cx=\"53.6\" cy=\"24.0\" r=\"9\" fill=\"#ffffff\" stroke=\"#111\" stroke-width=\"1.6\"/><circle cx=\"68.6\" cy=\"32.7\" r=\"9\" fill=\"#ffffff\" stroke=\"#111\" stroke-width=\"1.6\"/><\/g><\/svg><figcaption>Mixture of elements<\/figcaption><\/figure><figure class=\"fig\"><svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 220 162\" role=\"img\" style=\"width:100%;max-width:330px;height:auto;background:transparent\"><g transform=\"translate(0,0)\"><rect x=\"0.8\" y=\"0.8\" width=\"218.4\" height=\"138.4\" fill=\"#fff\" stroke=\"#111\" stroke-width=\"2\"/><circle cx=\"129.4\" cy=\"68.0\" r=\"9\" fill=\"#111111\" stroke=\"#111\" stroke-width=\"1.6\"/><circle cx=\"114.1\" cy=\"59.9\" r=\"9\" fill=\"#ffffff\" stroke=\"#111\" stroke-width=\"1.6\"/><circle cx=\"57.7\" cy=\"104.3\" r=\"9\" fill=\"#111111\" stroke=\"#111\" stroke-width=\"1.6\"/><circle cx=\"65.4\" cy=\"88.8\" r=\"9\" fill=\"#ffffff\" stroke=\"#111\" stroke-width=\"1.6\"/><circle cx=\"186.3\" cy=\"38.1\" r=\"9\" fill=\"#111111\" stroke=\"#111\" stroke-width=\"1.6\"/><circle cx=\"197.3\" cy=\"24.8\" r=\"9\" fill=\"#ffffff\" stroke=\"#111\" stroke-width=\"1.6\"/><circle cx=\"150.9\" cy=\"105.0\" r=\"9\" fill=\"#9b9b9b\" stroke=\"#111\" stroke-width=\"1.6\"/><circle cx=\"135.5\" cy=\"97.2\" r=\"9\" fill=\"#ffffff\" stroke=\"#111\" stroke-width=\"1.6\"/><circle cx=\"162.2\" cy=\"92.0\" r=\"9\" fill=\"#ffffff\" stroke=\"#111\" stroke-width=\"1.6\"/><circle cx=\"34.3\" cy=\"43.4\" r=\"9\" fill=\"#9b9b9b\" stroke=\"#111\" stroke-width=\"1.6\"/><circle cx=\"17.8\" cy=\"38.4\" r=\"9\" fill=\"#ffffff\" stroke=\"#111\" stroke-width=\"1.6\"/><circle cx=\"43.1\" cy=\"28.6\" r=\"9\" fill=\"#ffffff\" stroke=\"#111\" stroke-width=\"1.6\"/><circle cx=\"85.5\" cy=\"35.7\" r=\"9\" fill=\"#9b9b9b\" stroke=\"#111\" stroke-width=\"1.6\"/><circle cx=\"69.7\" cy=\"28.6\" r=\"9\" fill=\"#ffffff\" stroke=\"#111\" stroke-width=\"1.6\"/><circle cx=\"96.1\" cy=\"22.0\" r=\"9\" fill=\"#ffffff\" stroke=\"#111\" stroke-width=\"1.6\"/><\/g><\/svg><figcaption>Mixture of compounds<\/figcaption><\/figure><figure class=\"fig\"><svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 220 162\" role=\"img\" style=\"width:100%;max-width:330px;height:auto;background:transparent\"><g transform=\"translate(0,0)\"><rect x=\"0.8\" y=\"0.8\" width=\"218.4\" height=\"138.4\" fill=\"#fff\" stroke=\"#111\" stroke-width=\"2\"/><circle cx=\"101.3\" cy=\"76.1\" r=\"9\" fill=\"#111111\" stroke=\"#111\" stroke-width=\"1.6\"/><circle cx=\"125.9\" cy=\"37.8\" r=\"9\" fill=\"#111111\" stroke=\"#111\" stroke-width=\"1.6\"/><circle cx=\"133.6\" cy=\"99.9\" r=\"9\" fill=\"#111111\" stroke=\"#111\" stroke-width=\"1.6\"/><circle cx=\"80.0\" cy=\"40.3\" r=\"9\" fill=\"#9b9b9b\" stroke=\"#111\" stroke-width=\"1.6\"/><circle cx=\"65.1\" cy=\"49.1\" r=\"9\" fill=\"#ffffff\" stroke=\"#111\" stroke-width=\"1.6\"/><circle cx=\"75.1\" cy=\"23.7\" r=\"9\" fill=\"#ffffff\" stroke=\"#111\" stroke-width=\"1.6\"/><circle cx=\"183.6\" cy=\"103.8\" r=\"9\" fill=\"#9b9b9b\" stroke=\"#111\" stroke-width=\"1.6\"/><circle cx=\"182.6\" cy=\"121.0\" r=\"9\" fill=\"#ffffff\" stroke=\"#111\" stroke-width=\"1.6\"/><circle cx=\"167.1\" cy=\"98.6\" r=\"9\" fill=\"#ffffff\" stroke=\"#111\" stroke-width=\"1.6\"/><circle cx=\"36.0\" cy=\"72.1\" r=\"9\" fill=\"#9b9b9b\" stroke=\"#111\" stroke-width=\"1.6\"/><circle cx=\"27.2\" cy=\"57.2\" r=\"9\" fill=\"#ffffff\" stroke=\"#111\" stroke-width=\"1.6\"/><circle cx=\"52.5\" cy=\"67.1\" r=\"9\" fill=\"#ffffff\" stroke=\"#111\" stroke-width=\"1.6\"/><\/g><\/svg><figcaption>Mixture of an element and a compound<\/figcaption><\/figure>\n<p><b>Also tell the state:<\/b> particles far apart and spread out = <b>gas<\/b>; close together and irregular = <b>liquid<\/b>; close together in a regular pattern = <b>solid<\/b>.<\/p>\n<div class=\"box\"><b>Writing formulas for particles (#10).<\/b> Count the atoms of each element in <b>one particle<\/b> and use <b>subscripts<\/b>. Example: a particle with one black atom (X) and two white atoms (Z) is <b>XZ₂<\/b>. A single atom is just its symbol, e.g., <b>Z<\/b>. Two touching gray atoms (Y) = <b>Y₂<\/b>.<\/div>\n","checks":[{"q":"Which container is a pure substance that is an ELEMENT?","o":["A container of identical molecules each made of 1 gray + 2 white atoms","A container of two different compounds","A container of identical molecules each made of 2 white atoms","A container of black atoms and white diatomic molecules"],"a":2,"w":"One color of atom and all particles identical = element."},{"q":"A container holds identical molecules, each made of one gray atom touching two white atoms. This is a...","o":["mixture of compounds","element","compound","mixture of elements"],"a":2,"w":"All particles identical, different atoms bonded = compound."},{"q":"A particle has two black atoms (X) touching one white atom (Z). Its formula is...","o":["2XZ","X₂Z₂","XZ₂","X₂Z"],"a":3,"w":"Two X and one Z: X₂Z."}]}],"quiz":[{"q":"This container is...","o":["a pure element","a compound","a mixture of compounds","a mixture of elements"],"a":3,"w":"Single black atoms + white diatomic molecules: more than one type of particle, and both are elements.","svg":"mix_el"},{"q":"This container is...","o":["an element","a mixture of elements","a mixture of compounds","a compound"],"a":3,"w":"All particles identical; each has different atoms bonded.","svg":"compound"},{"q":"This container is...","o":["a mixture of an element and a compound","a pure element","a compound","a mixture of compounds"],"a":0,"w":"Black atoms (an element) are mixed with identical gray/white molecules (a compound).","svg":"mix_el_comp"},{"q":"O₂ is...","o":["a compound","an element (a diatomic molecule)","a mixture","an atom of a compound"],"a":1,"w":"Two identical atoms bonded = diatomic element."},{"q":"Which statement is TRUE?","o":["All molecules are compounds.","All mixtures are pure substances.","You can't have an atom of a compound.","Elements are made of different atoms."],"a":2,"w":"A compound's smallest particle is a molecule; O₂ shows that not all molecules are compounds."}]},{"id":"s4","num":4,"color":"#a77dff","title":"Characteristic Properties & Separating Mixtures","tag":"Review packet #2 and #3 (plus the Describing Substances worksheet)","intro":"Use properties that identify a substance to separate the components of a mixture.","lessons":[{"id":"l4_1","title":"Characteristic properties","html":"\n<div class=\"box\"><b>Characteristic properties<\/b> are properties that can be used to <b>identify an unknown substance<\/b>.<\/div>\n<p><b>Examples (list at least 5):<\/b> <b>color<\/b>, <b>solubility in water<\/b>, <b>boiling point<\/b>, <b>state of matter at room temperature<\/b>, <b>viscosity<\/b>, <b>odor<\/b>, <b>magnetism<\/b> (also density and melting point).<\/p>\n","checks":[{"q":"Which of these is a characteristic property?","o":["The size of the beaker","The name on the label","The amount of sample","Boiling point"],"a":3,"w":"Boiling point identifies a substance regardless of amount."},{"q":"What are characteristic properties used for?","o":["Measuring temperature","Counting particles","Drawing diagrams","Identifying an unknown substance"],"a":3,"w":"They help identify unknowns and choose separation methods."}]},{"id":"l4_2","title":"Mixtures vs. compounds (iron + sulfur)","html":"\n<div class=\"tw\"><table class=\"tbl\"><tr><th><\/th><th>Mixture<\/th><th>Compound<\/th><\/tr>\n<tr><td><b>Particles<\/b><\/td><td>More than one type<\/td><td>All identical<\/td><\/tr>\n<tr><td><b>Composition<\/b><\/td><td>Variable<\/td><td>Fixed ratio<\/td><\/tr>\n<tr><td><b>Characteristic properties<\/b><\/td><td><b>Retained<\/b> – each part keeps its own<\/td><td>A <b>new single set<\/b> (only ONE boiling point, ONE color...)<\/td><\/tr>\n<tr><td><b>Bonding<\/b><\/td><td>Not chemically bonded<\/td><td>Chemically bonded<\/td><\/tr>\n<tr><td><b>Separation<\/b><\/td><td>By physical means<\/td><td>Only by chemical reactions<\/td><\/tr><\/table><\/div>\n<p><b>Iron + sulfur demo:<\/b> Iron (Fe, a metal) and sulfur (S, a nonmetal) are both visible when mixed and iron is <b>magnetic<\/b>, so a <b>magnet separates<\/b> the iron. When they were <b>heated<\/b> they became a <b>compound<\/b> with new properties, and a magnet could no longer separate them.<\/p>\n<figure class=\"fig wide\"><svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 416 152\" role=\"img\" style=\"width:100%;max-width:624px;height:auto;background:transparent\"><g transform=\"translate(0,0)\"><rect x=\"0.8\" y=\"0.8\" width=\"198.4\" height=\"128.4\" fill=\"#fff\" stroke=\"#111\" stroke-width=\"2\"/><circle cx=\"99.1\" cy=\"70.2\" r=\"9\" fill=\"#111111\" stroke=\"#111\" stroke-width=\"1.6\"/><circle cx=\"70.9\" cy=\"48.5\" r=\"9\" fill=\"#111111\" stroke=\"#111\" stroke-width=\"1.6\"/><circle cx=\"46.1\" cy=\"77.1\" r=\"9\" fill=\"#111111\" stroke=\"#111\" stroke-width=\"1.6\"/><circle cx=\"130.6\" cy=\"77.4\" r=\"9\" fill=\"#111111\" stroke=\"#111\" stroke-width=\"1.6\"/><circle cx=\"89.2\" cy=\"32.3\" r=\"9\" fill=\"#111111\" stroke=\"#111\" stroke-width=\"1.6\"/><circle cx=\"177.9\" cy=\"50.3\" r=\"9\" fill=\"#111111\" stroke=\"#111\" stroke-width=\"1.6\"/><circle cx=\"120.7\" cy=\"35.4\" r=\"9\" fill=\"#d6d6d6\" stroke=\"#111\" stroke-width=\"1.6\"/><circle cx=\"40.1\" cy=\"24.4\" r=\"9\" fill=\"#d6d6d6\" stroke=\"#111\" stroke-width=\"1.6\"/><circle cx=\"21.3\" cy=\"54.4\" r=\"9\" fill=\"#d6d6d6\" stroke=\"#111\" stroke-width=\"1.6\"/><circle cx=\"85.0\" cy=\"107.0\" r=\"9\" fill=\"#d6d6d6\" stroke=\"#111\" stroke-width=\"1.6\"/><circle cx=\"142.7\" cy=\"105.3\" r=\"9\" fill=\"#d6d6d6\" stroke=\"#111\" stroke-width=\"1.6\"/><circle cx=\"160.2\" cy=\"84.3\" r=\"9\" fill=\"#d6d6d6\" stroke=\"#111\" stroke-width=\"1.6\"/><text x=\"100.0\" y=\"147\" text-anchor=\"middle\" font-family=\"Arial,sans-serif\" font-size=\"13\" font-weight=\"bold\" fill=\"#111\">Mixture of iron and sulfur<\/text><\/g><g transform=\"translate(216,0)\"><rect x=\"0.8\" y=\"0.8\" width=\"198.4\" height=\"128.4\" fill=\"#fff\" stroke=\"#111\" stroke-width=\"2\"/><circle cx=\"153.4\" cy=\"42.2\" r=\"9\" fill=\"#111111\" stroke=\"#111\" stroke-width=\"1.6\"/><circle cx=\"170.4\" cy=\"39.0\" r=\"9\" fill=\"#d6d6d6\" stroke=\"#111\" stroke-width=\"1.6\"/><circle cx=\"55.2\" cy=\"67.5\" r=\"9\" fill=\"#111111\" stroke=\"#111\" stroke-width=\"1.6\"/><circle cx=\"69.0\" cy=\"57.2\" r=\"9\" fill=\"#d6d6d6\" stroke=\"#111\" stroke-width=\"1.6\"/><circle cx=\"107.5\" cy=\"78.4\" r=\"9\" fill=\"#111111\" stroke=\"#111\" stroke-width=\"1.6\"/><circle cx=\"98.0\" cy=\"92.8\" r=\"9\" fill=\"#d6d6d6\" stroke=\"#111\" stroke-width=\"1.6\"/><circle cx=\"111.0\" cy=\"31.2\" r=\"9\" fill=\"#111111\" stroke=\"#111\" stroke-width=\"1.6\"/><circle cx=\"115.1\" cy=\"48.0\" r=\"9\" fill=\"#d6d6d6\" stroke=\"#111\" stroke-width=\"1.6\"/><circle cx=\"153.8\" cy=\"108.6\" r=\"9\" fill=\"#111111\" stroke=\"#111\" stroke-width=\"1.6\"/><circle cx=\"163.6\" cy=\"94.4\" r=\"9\" fill=\"#d6d6d6\" stroke=\"#111\" stroke-width=\"1.6\"/><circle cx=\"29.6\" cy=\"101.0\" r=\"9\" fill=\"#111111\" stroke=\"#111\" stroke-width=\"1.6\"/><circle cx=\"44.7\" cy=\"92.6\" r=\"9\" fill=\"#d6d6d6\" stroke=\"#111\" stroke-width=\"1.6\"/><text x=\"100.0\" y=\"147\" text-anchor=\"middle\" font-family=\"Arial,sans-serif\" font-size=\"13\" font-weight=\"bold\" fill=\"#111\">Compound of iron and sulfur<\/text><\/g><\/svg><figcaption>Describing Substances #3: 6 particles of iron<br>mixed with sulfur vs. bonded to sulfur<\/figcaption><\/figure>\n<p><b>Alcohol + water:<\/b> properties retained – alcohol is <b>flammable<\/b>, water is not; so the alcohol can be burned off and the water left behind.<\/p>\n","checks":[{"q":"Why can a magnet separate iron from an iron/sulfur MIXTURE but not from the iron sulfide COMPOUND?","o":["Magnets only work on gases","The compound has more iron","In the mixture iron keeps its magnetism; in the compound the iron is bonded and the compound has new properties","Sulfur is magnetic"],"a":2,"w":"Mixtures retain characteristic properties; compounds form a new single set."},{"q":"Which is a difference between a mixture and a compound?","o":["A mixture has only one boiling point","A compound can be separated by filtering","A mixture has fixed composition","A compound has a fixed ratio; a mixture has variable composition"],"a":3,"w":"Compound = fixed composition."},{"q":"A compound has how many sets of characteristic properties?","o":["One (a new single set)","As many as it has elements","Two","None"],"a":0,"w":"Only ONE color, ONE BP, etc."}]},{"id":"l4_3","title":"Separation techniques","html":"\n<div class=\"tw\"><table class=\"tbl\"><tr><th>Technique<\/th><th>What it does<\/th><th>Characteristic property used<\/th><\/tr>\n<tr><td><b>Filtration<\/b><\/td><td>Separates an insoluble solid from a liquid using filter paper<\/td><td>Difference in <b>solubility<\/b> AND <b>particle size<\/b><\/td><\/tr>\n<tr><td><b>Evaporation<\/b><\/td><td>Removes a liquid solvent from a solution by heating, leaving the dissolved solid<\/td><td>Difference in <b>boiling point<\/b><\/td><\/tr>\n<tr><td><b>Distillation<\/b><\/td><td>Separates pure liquids from a liquid mixture: heat to vaporize the most volatile liquid, then cool to condense it<\/td><td>Difference in <b>boiling point<\/b><\/td><\/tr>\n<tr><td><b>Chromatography<\/b><\/td><td>Components move at different rates through a solid or liquid medium<\/td><td>Attraction and solubility<\/td><\/tr>\n<tr><td><b>Magnetic separation<\/b><\/td><td>Magnet pulls out magnetic solids<\/td><td><b>Magnetism<\/b><\/td><\/tr>\n<tr><td><b>Separating funnel<\/b><\/td><td>Separates two immiscible (non-mixing) liquids (not demonstrated in class)<\/td><td>Different <b>density<\/b><\/td><\/tr><\/table><\/div>\n<figure class=\"fig wide\"><svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 420 230\" style=\"width:100%;max-width:520px;height:auto\" font-family=\"Arial,sans-serif\" font-size=\"12\"><rect width=\"420\" height=\"230\" fill=\"#fff\"/><polygon points=\"40,20 100,20 95,70 45,70\" fill=\"#fff\" stroke=\"#111\" stroke-width=\"2\" transform=\"rotate(35 70 45)\"/><circle cx=\"62\" cy=\"52\" r=\"2\" fill=\"#a67c52\"/><circle cx=\"72\" cy=\"58\" r=\"2\" fill=\"#a67c52\"/><circle cx=\"80\" cy=\"50\" r=\"2\" fill=\"#a67c52\"/><polygon points=\"120,70 220,70 180,125 160,125\" fill=\"#fff\" stroke=\"#111\" stroke-width=\"2\"/><polygon points=\"130,72 210,72 175,118 165,118\" fill=\"#fdf3d0\" stroke=\"#b79b3c\"/><rect x=\"166\" y=\"125\" width=\"8\" height=\"26\" fill=\"#fff\" stroke=\"#111\" stroke-width=\"2\"/><polygon points=\"162,150 178,150 178,160 225,215 115,215 162,160\" fill=\"#fff\" stroke=\"#111\" stroke-width=\"2\"/><polygon points=\"130,200 210,200 225,215 115,215\" fill=\"#cfe8ff\" stroke=\"#111\"/><circle cx=\"150\" cy=\"95\" r=\"2\" fill=\"#a67c52\"/><circle cx=\"165\" cy=\"102\" r=\"2\" fill=\"#a67c52\"/><circle cx=\"182\" cy=\"96\" r=\"2\" fill=\"#a67c52\"/><text x=\"230\" y=\"60\" fill=\"#111\">Filter paper traps the solid<\/text><line x1=\"228\" y1=\"64\" x2=\"205\" y2=\"90\" stroke=\"#111\"/><text x=\"232\" y=\"190\" fill=\"#111\">Filtrate (liquid + dissolved<\/text><text x=\"232\" y=\"204\" fill=\"#111\">salt) passes through<\/text><line x1=\"230\" y1=\"195\" x2=\"205\" y2=\"205\" stroke=\"#111\"/><text x=\"10\" y=\"100\" fill=\"#111\">Mixture<\/text><text x=\"10\" y=\"114\" fill=\"#111\">poured in<\/text><\/svg><figcaption>Filtration<\/figcaption><\/figure><figure class=\"fig wide\"><svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 440 260\" style=\"width:100%;max-width:580px;height:auto\" font-family=\"Arial,sans-serif\" font-size=\"12\"><rect width=\"440\" height=\"260\" fill=\"#fff\"/><line x1=\"45\" y1=\"175\" x2=\"155\" y2=\"175\" stroke=\"#444\" stroke-width=\"3\"/><line x1=\"55\" y1=\"175\" x2=\"50\" y2=\"245\" stroke=\"#444\" stroke-width=\"3\"/><line x1=\"145\" y1=\"175\" x2=\"150\" y2=\"245\" stroke=\"#444\" stroke-width=\"3\"/><polygon points=\"92,245 108,245 104,215 96,215\" fill=\"#888\" stroke=\"#333\"/><path d=\"M100 213 q-7 -14 0 -26 q7 12 0 26z\" fill=\"#3b82f6\" stroke=\"#1d4ed8\"/><circle cx=\"100\" cy=\"130\" r=\"42\" fill=\"#fff\" stroke=\"#111\" stroke-width=\"2\"/><path d=\"M58 133 a42 42 0 0 0 84 0z\" fill=\"#e8d5a8\" stroke=\"#111\"/><rect x=\"91\" y=\"60\" width=\"18\" height=\"34\" fill=\"#fff\" stroke=\"#111\" stroke-width=\"2\"/><rect x=\"95\" y=\"38\" width=\"10\" height=\"82\" fill=\"#fff\" stroke=\"#111\" stroke-width=\"1.5\"/><rect x=\"98\" y=\"80\" width=\"4\" height=\"40\" fill=\"#c0392b\"/><line x1=\"109\" y1=\"70\" x2=\"195\" y2=\"88\" stroke=\"#111\" stroke-width=\"2\"/><g transform=\"translate(195,88) rotate(20)\"><rect x=\"0\" y=\"-10\" width=\"130\" height=\"20\" fill=\"#cfe8ff\" stroke=\"#111\" stroke-width=\"2\"/><\/g><line x1=\"317\" y1=\"132\" x2=\"345\" y2=\"142\" stroke=\"#111\" stroke-width=\"2\"/><line x1=\"345\" y1=\"142\" x2=\"345\" y2=\"196\" stroke=\"#111\" stroke-width=\"2\"/><polygon points=\"336,196 354,196 378,245 312,245\" fill=\"#fff\" stroke=\"#111\" stroke-width=\"2\"/><polygon points=\"322,228 368,228 378,245 312,245\" fill=\"#bfe3ff\" stroke=\"#111\"/><line x1=\"285\" y1=\"246\" x2=\"410\" y2=\"246\" stroke=\"#444\" stroke-width=\"3\"/><text x=\"75\" y=\"22\" fill=\"#111\">Thermometer<\/text><line x1=\"100\" y1=\"26\" x2=\"100\" y2=\"38\" stroke=\"#111\"/><text x=\"150\" y=\"155\" fill=\"#111\">Heated mixture<\/text><text x=\"150\" y=\"170\" fill=\"#111\">in distilling flask<\/text><text x=\"150\" y=\"232\" fill=\"#111\">Burner<\/text><text x=\"215\" y=\"58\" fill=\"#111\">Condenser (cools the vapor)<\/text><line x1=\"250\" y1=\"62\" x2=\"250\" y2=\"94\" stroke=\"#111\"/><text x=\"372\" y=\"200\" fill=\"#111\">Receiving<\/text><text x=\"372\" y=\"214\" fill=\"#111\">flask<\/text><text x=\"372\" y=\"228\" fill=\"#111\">(distillate)<\/text><\/svg><figcaption>Simple distillation<\/figcaption><\/figure>\n","checks":[{"q":"Which technique separates two liquids using their different boiling points?","o":["Magnetic separation","Chromatography","Distillation","Filtration"],"a":2,"w":"Heat → the lower-boiling liquid vaporizes first → cool to condense."},{"q":"Which characteristic properties make filtration work?","o":["Magnetism","Odor","Difference in solubility and particle size","Boiling point"],"a":2,"w":"The insoluble solid has larger particles than the liquid, so it is trapped."},{"q":"A separating funnel is used for...","o":["sand and salt","iron and sulfur","two immiscible liquids with different densities","a solid dissolved in a liquid"],"a":2,"w":"Immiscible = does not mix."}]},{"id":"l4_4","title":"The class demos","html":"\n<h4>Sand + salt<\/h4>\n<p>Add water: <b>salt dissolves, sand doesn't<\/b> (different solubility). <b>Filtration<\/b> traps the sand (different particle sizes: small particles pass through the filter). <b>Evaporate<\/b> the water to get the salt back – the boiling point of salt is very high. (Salt on a sweaty dark shirt = salt left behind after the water evaporates.)<\/p>\n<p><b>Could the same technique separate salt and water?<\/b> No – both pass through the filter. <b>Salt and sugar?<\/b> No – both dissolve in water and have similar particle size, so filtering can't tell them apart.<\/p>\n<h4>Alcohol + water<\/h4>\n<p><b>Water boils at 100 °C; alcohol at 75 °C<\/b> (class notes) → separate by <b>distillation<\/b>. Alcohol is also <b>flammable<\/b>: dish 1 (alcohol) burned to nothing; dish 2 (mineral oil) gave a brief blue flame; dish 3 (water) put the flame out.<\/p>\n<h4>Iron + sulfur<\/h4>\n<p>Mixture: separate with a <b>magnet<\/b>. After heating, a compound forms and can no longer be separated that way.<\/p>\n","checks":[{"q":"How do you separate a sand + salt mixture?","o":["Burn it","Add water, filter out the sand, then evaporate the water to recover the salt","Use a magnet","Distill it without water"],"a":1,"w":"Salt dissolves, sand does not."},{"q":"Why can't filtration separate a mixture of salt and sugar?","o":["Both are magnetic","They have different boiling points","Both dissolve in water and pass through the filter","Neither dissolves"],"a":2,"w":"Similar solubility and particle size – no difference to exploit."},{"q":"Alcohol boils at about 75 °C and water at 100 °C. What does that allow?","o":["Separation by filtration","Separation by distillation","Separation by magnet","No separation is possible"],"a":1,"w":"Different boiling points."}]}],"quiz":[{"q":"Which is NOT a characteristic property?","o":["Boiling point","Solubility in water","Amount of the sample","Odor"],"a":2,"w":"Amount (mass or volume of sample) does not identify a substance."},{"q":"Which technique uses a difference in boiling point to separate two liquids?","o":["Filtration","Dissolving","Distillation","Magnetic separation"],"a":2,"w":"Distillation."},{"q":"A mixture retains the characteristic properties of its parts. Which is an example?","o":["Alcohol is still flammable when mixed with water","Iron loses its magnetism when mixed with sulfur","Salt has a new color when mixed with sand","Water and sand form one new substance"],"a":0,"w":"Alcohol stays flammable."},{"q":"Which statement about compounds is TRUE?","o":["They keep each element's properties","They can be separated with a magnet","They have variable composition","They have a single new set of properties"],"a":3,"w":"One set of new properties."},{"q":"Heating iron and sulfur until they combine produces...","o":["sulfur only","a diatomic element","a compound that can no longer be separated with a magnet","a mixture with a variable ratio"],"a":2,"w":"A chemical change produced the compound."}]},{"id":"s5","num":5,"color":"#ff6b81","title":"The Periodic Table","tag":"Review packet #1 (group, period, location of the families) + class periodic table reading/coloring","intro":"The geography of the periodic table and how it helps you predict properties.","lessons":[{"id":"l5_1","title":"Where the periodic table came from","html":"\n<ul>\n<li>By the 1700s only about 30 elements were known; the modern table has <b>118<\/b>.<\/li>\n<li><b>Mendeleev (1869)<\/b> arranged elements by increasing <b>atomic mass<\/b> and noticed a <b>periodic repetition<\/b> of properties. He put elements with similar properties in the same <b>column<\/b>, and used the patterns to <b>predict<\/b> elements not yet discovered (he predicted the properties of <b>germanium<\/b> before it was found).<\/li>\n<li><b>Moseley (1913)<\/b> discovered <b>atomic number<\/b>. The correct way to organize the table is by <b>atomic number<\/b>, not mass.<\/li>\n<\/ul>\n<div class=\"box\"><b>Periodic Law:<\/b> when elements are arranged in order of <b>increasing atomic number<\/b>, their physical and chemical properties show a <b>regular, repeating pattern<\/b>. (\"Periodic\" = repeating at regular intervals.)<\/div>\n","checks":[{"q":"What did Mendeleev notice when he arranged elements by increasing atomic mass?","o":["A periodic (repeating) pattern in their properties","That all elements are gases","That atoms have no charge","That all elements were metals"],"a":0,"w":"He saw properties repeat, which let him predict undiscovered elements."},{"q":"The Periodic Law says that when elements are arranged by increasing ____, properties repeat in a regular pattern.","o":["atomic mass only","density","alphabetical order","atomic number"],"a":3,"w":"Atomic number (Moseley)."}]},{"id":"l5_2","title":"How the table is organized","html":"\n<ul>\n<li>Each square is one element: <b>atomic number<\/b> above, <b>symbol<\/b> in the center, <b>name<\/b> and <b>atomic mass<\/b> below. Elements are in order of increasing atomic number.<\/li>\n<li><b>Periods<\/b> = the <b>horizontal rows<\/b> (across). There are <b>7<\/b> periods.<\/li>\n<li><b>Groups (families)<\/b> = the <b>vertical columns<\/b> (up and down). There are <b>18<\/b> groups. Elements in the same group have <b>similar physical and chemical properties<\/b>.<\/li>\n<li>American labeling: the tall columns are groups <b>1A–8A<\/b> (the <b>representative elements<\/b>); the shorter middle columns are the <b>B groups<\/b>.<\/li>\n<\/ul>\n<figure class=\"fig\"><svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 270 150\" style=\"width:100%;max-width:420px;height:auto\" font-family=\"Arial,sans-serif\"><rect width=\"270\" height=\"150\" fill=\"#fff\"/><rect x=\"6\" y=\"6\" width=\"13\" height=\"13\" fill=\"#eceff1\" stroke=\"#90a4ae\" stroke-width=\".6\"/><rect x=\"244\" y=\"6\" width=\"13\" height=\"13\" fill=\"#eceff1\" stroke=\"#90a4ae\" stroke-width=\".6\"/><rect x=\"6\" y=\"20\" width=\"13\" height=\"13\" fill=\"#eceff1\" stroke=\"#90a4ae\" stroke-width=\".6\"/><rect x=\"20\" y=\"20\" width=\"13\" height=\"13\" fill=\"#eceff1\" stroke=\"#90a4ae\" stroke-width=\".6\"/><rect x=\"174\" y=\"20\" width=\"13\" height=\"13\" fill=\"#eceff1\" stroke=\"#90a4ae\" stroke-width=\".6\"/><rect x=\"188\" y=\"20\" width=\"13\" height=\"13\" fill=\"#eceff1\" stroke=\"#90a4ae\" stroke-width=\".6\"/><rect x=\"202\" y=\"20\" width=\"13\" height=\"13\" fill=\"#ffd54a\" stroke=\"#90a4ae\" stroke-width=\".6\"/><rect x=\"216\" y=\"20\" width=\"13\" height=\"13\" fill=\"#eceff1\" stroke=\"#90a4ae\" stroke-width=\".6\"/><rect x=\"230\" y=\"20\" width=\"13\" height=\"13\" fill=\"#eceff1\" stroke=\"#90a4ae\" stroke-width=\".6\"/><rect x=\"244\" y=\"20\" width=\"13\" height=\"13\" fill=\"#eceff1\" stroke=\"#90a4ae\" stroke-width=\".6\"/><rect x=\"6\" y=\"34 tals<\/td><\/tr>\n<tr><td><b>Properties<\/b><\/td><td>Shiny (luster), good conductors of heat and electricity, malleable, ductile, high melting/boiling points (solid at room temp; <b>mercury<\/b> is an exception); some magnetic<\/td><td>Not shiny, poor conductors, brittle as solids, low melting/boiling points; many are gases at room temp; solids, liquids or gases<\/td><td>Properties <b>between<\/b> metals and nonmetals (e.g., silicon is a semiconductor)<\/td><\/tr><\/table><\/div>\n<p><b>Metalloids:<\/b> boron (B), silicon (Si), germanium (Ge), arsenic (As), antimony (Sb), tellurium (Te) – plus polonium or astatine depending on the classification system (the class slide shows astatine).<\/p>\n<p>Most elements are <b>metals<\/b>. <b>Hydrogen<\/b> sits in Group 1A but is a <b>nonmetal<\/b>.<\/p>\n","checks":[{"q":"Where on the periodic table are metals found?","o":["Left and center","Only the bottom row","Only along the staircase","Upper right"],"a":0,"w":"Metals are left and center."},{"q":"Which element is a metalloid?","o":["Oxygen (O)","Sodium (Na)","Iron (Fe)","Silicon (Si)"],"a":3,"w":"Si is on the staircase."},{"q":"Which is a property of nonmetals?","o":["Always solids at room temperature","Poor conductors of heat and electricity","Malleable and ductile","Shiny"],"a":1,"w":"Nonmetals are poor conductors and brittle if solid."}]},{"id":"l5_4","title":"The families","html":"\n<div class=\"tw\"><table class=\"tbl\"><tr><th>Family<\/th><th>Location<\/th><th>Notes<\/th><th>Examples<\/th><\/tr>\n<tr><td><b>Alkali metals<\/b><\/td><td>Group <b>1A<\/b> (1)<\/td><td>Highly reactive metals; react violently with water<\/td><td>Li, Na, K, Cs<\/td><\/tr>\n<tr><td><b>Alkaline earth metals<\/b><\/td><td>Group <b>2A<\/b> (2)<\/td><td>Reactive metals<\/td><td>Be, Mg, Ca, Sr, Ba<\/td><\/tr>\n<tr><td><b>Transition metals<\/b><\/td><td><b>B groups<\/b> (middle)<\/td><td>Metals often forming colorful compounds<\/td><td>Fe, Cu, Au, Ag<\/td><\/tr>\n<tr><td><b>Inner transition metals<\/b><\/td><td>Two rows below the main table<\/td><td>Sometimes called the rare-earth elements<\/td><td>U<\/td><\/tr>\n<tr><td><b>Halogens<\/b><\/td><td>Group <b>7A<\/b> (17)<\/td><td>Highly reactive nonmetals<\/td><td>F, Cl, Br, I<\/td><\/tr>\n<tr><td><b>Noble gases<\/b><\/td><td>Group <b>8A<\/b> (18)<\/td><td>Extremely unreactive, stable gases<\/td><td>He, Ne, Ar, Kr<\/td><\/tr><\/table><\/div>\n<p class=\"note\">The review sheet prints \"Group 1A\" for all four families – the correct groups are 1A, 2A, 7A and 8A.<\/p>\n<p>Use the <b>Periodic Table tab<\/b> to see each family highlighted and practise clicking the right location.<\/p>\n","checks":[{"q":"Which group are the halogens?","o":["8A (18)","1A (1)","7A (17)","2A (2)"],"a":2,"w":"Halogens are Group 7A."},{"q":"Which family is extremely unreactive?","o":["Halogens","Noble gases","Alkali metals","Alkaline earth metals"],"a":1,"w":"Noble gases (8A)."},{"q":"The general term for elements in the B groups is...","o":["halogens","transition metals","alkali metals","metalloids"],"a":1,"w":"B groups = transition metals."}]},{"id":"l5_5","title":"The 46 elements to know","html":"\n<p>Your teacher's list asks you to know each element's <b>name<\/b>, <b>symbol<\/b> (only the first letter is capital: <b>Sn<\/b>, not SN) and its <b>type<\/b>: <b>metal (M)<\/b>, <b>transition metal (TM)<\/b>, <b>semimetal (SM)<\/b> or <b>nonmetal (NM)<\/b>. Spelling counts! (The test gives you a periodic table with names and symbols to use for classification.)<\/p>\n<div id=\"elementlist\"><\/div>\n<p class=\"note\">Uranium is marked with an asterisk on the class list; it is an inner transition metal, so it is listed here as a metal. Use the flashcards (Periodic Table deck) to practice.<\/p>\n","checks":[{"q":"Copper (Cu) is a...","o":["noble gas","semimetal","nonmetal","transition metal"],"a":3,"w":"Cu is in the B groups."},{"q":"Which symbol is written correctly?","o":["sn","sN","Sn","SN"],"a":2,"w":"Only the first letter is capital."}, nd observations of things you can see, smell or feel. Particles are NOT evidence because you can't see them.","sec":"s1"},{"t":"CER","d":"Claim (the answer), Evidence (observable data) and Reasoning (explains how the evidence supports the claim, using vocabulary).","sec":"s1"},{"t":"Kinetic Molecular Theory (KMT)","d":"Gas particles are in constant random motion, travel in straight lines, and change direction when they collide (like bumper cars).","sec":"s1"},{"t":"Elastic collision","d":"A collision in which energy is transferred from the higher-energy particle to the lower-energy particle, but the total energy is conserved.","sec":"s2"},{"t":"Diffusion","d":"The gradual mixing of particles as they move from an area of high concentration to an area of low concentration.","sec":"s2"},{"t":"Concentration","d":"The number of particles per unit area (or volume).","sec":"s2"},{"t":"Random walk","d":"The zig-zag path of a particle that changes direction at each collision, moving in no particular direction.","sec":"s2"},{"t":"Temperature","d":"A measure of the average kinetic energy of the particles (indirectly, how fast they are moving).","sec":"s2"},{"t":"Kinetic energy","d":"The energy of motion: KE = ½mv². Higher speed means higher kinetic energy.","sec":"s2"},{"t":"Thermal expansion","d":"Matter generally expands when it is heated and contracts when it is cooled (water is a well-known exception).","sec":"s2"},{"t":"Pure substance","d":"Matter with only one type of particle (all particles identical), fixed composition and one set of characteristic properties. Can't be separated by physical means.","sec":"s3"},{"t":"Mixture","d":"Matter with more than one type of particle and variable composition. Each part keeps its characteristic properties, and it can be separated by physical means.","sec":"s3"},{"t":"Homogeneous","d":"Exists in one phase only and has uniform properties throughout the sample.","sec":"s3"},{"t":"Heterogeneous","d":"May exist in more than one phase and has variable properties in different parts of the sample.","sec":"s3"},{"t":"Atom","d":"The smallest particle of an element with unique properties.","sec":"s3"},{"t":"Molecule","d":"2 or more atoms chemically combined (bonded together).","sec":"s3"},{"t":"Particle","d":"The smallest unit that makes up a substance. It can be an atom or a molecule.","sec":"s3"},{"t":"Element","d":"A pure substance made of only one type of atom. It is on the periodic table and can't be broken down into simpler substances.","sec":"s3"},{"t":"Compound","d":"A pure substance formed when 2 or more different elements are chemically bonded in a fixed ratio, making a new substance with a new set of characteristic properties.","sec":"s3"},{"t":"Diatomic element","d":"An element that naturally exists as a pair of identical atoms bonded together (H₂, N₂, O₂, F₂, Cl₂, Br₂, I₂).","sec":"s3"},{"t":"Chemical formula","d":"Symbols with subscripts that show the atoms in one particle, e.g., H₂O or O₂.","sec":"s3"},{"t":"Characteristic properties","d":"Properties that can be used to identify an unknown substance (e.g., color, solubility in water, boiling point, state at room temperature, viscosity, odor, magnetism).","sec":"s4"},{"t":"Filtration","d":"Separates an insoluble solid from a liquid using filter paper. Uses differences in solubility and particle size.","sec":"s4"},{"t":"Evaporation","d":"Removes a liquid solvent from a solution by heating, leaving the dissolved solid. Uses a difference in boiling point.","sec":"s4"},{"t":"Distillation","d":"Separates liquids in a mixture by heating to vaporize the most volatile one, then cooling to condense it. Uses a difference in boiling point.","sec":"s4"},{"t":"Chromatography","d":"Separates the components of a mixture as they move at different rates through a solid or liquid medium, based on attraction and solubility.","sec":"s4"},{"t":"Magnetic separation","d":"Uses a magnet to separate magnetic solids from non-magnetic materials.","sec":"s4"},{"t":"Separating funnel","d":"Separates two immiscible (non-mixing) liquids that have different densities.","sec":"s4"},{"t":"Periodic law","d":"When elements are arranged in order of increasing atomic number, their physical and chemical properties show a regular, repeating pattern.","sec":"s5"},{"t":"Atomic number","d":"The whole number assigned to each element (found by Moseley) that the periodic table is ordered by.","sec":"s5"},{"t":"Period","d":"A horizontal row on the periodic table (there are 7).","sec":"s5"},{"t":"Group (family)","d":"A vertical column on the periodic table (there are 18). Elements in a group have similar properties.","sec":"s5"},{"t":"Representative elements","d":"The elements in groups 1A–8A (the tall columns of the periodic table).","sec":"s5"},{"t":"Metals","d":"Elements on the left and center of the table: shiny, good conductors, malleable and ductile, high melting points (mostly solids).","sec":"s5"},{"t":"Nonmetals","d":"Elements on the upper right of the table (plus hydrogen): not shiny, poor conductors, brittle as solids; many are gases.","sec":"s5"},{"t":"Metalloids (semimetals)","d":"Elements along the staircase between metals and nonmetals with properties in between (B, Si, Ge, As, Sb, Te...).","sec":"s5"},{"t":"Alkali metals","d":"Group 1A: highly reactive metals that react violently with water.","sec":"s5"},{"t":"Alkaline earth metals","d":"Group 2A: reactive metals.","sec":"s5"},{"t":"Transition metals","d":"The B-group elements in the middle of the table: metals that often form colorful compounds.","sec":"s5"},{"t":"Inner transition metals","d":"The two rows of elements placed below the main table (sometimes called rare-earth elements).","sec":"s5"},{"t":"Halogens","d":"Group 7A: highly reactive nonmetals.","sec":"s5"},{"t":"Noble gases","d":"Group 8A: extremely unreactive, stable gases.","sec":"s5"}],"diag":[{"t":"Solid","fig":"solid","pts":["Particles touching, close together","Organized in a fixed lattice (rows)","Resting at the bottom of the container","Particles only vibrate in place"],"sec":"s1"},{"t":"Liquid","fig":"liquid","pts":["Particles close together and touching","No organized pattern","Rests at the bottom (fills only part of the container)","Arrows show motion – they slip past one another"],"sec":"s1"},{"t":"Gas","fig":"gas","pts":["Particles very far apart","Spread out everywhere in the container","Arrows show fast, random motion","Fills the whole container"],"sec":"s1"},{"t":"Gas in a syringe (before / after)","fig":"syringe","pts":["Same number of particles in both boxes","Plunger pushed: the box is smaller, so the particles are closer together","Gas can be compressed because there is a lot of space between particles"],"sec":"s1"},{"t":"Element – single atoms","fig":"el_atoms","pts":["One color of atom only","No touching atoms of different colors","Pure substance (all particles identical)"],"sec":"s3"},{"t":"Element – diatomic molecules","fig":"el_diatomic","pts":["Pairs of identical atoms touching","All particles identical","Pure substance, still an ELEMENT (e.g., O₂)"],"sec":"s3"},{"t":"Compound","fig":"compound","pts":["All molecules are identical","Each molecule has different atoms touching (fixed ratio)","Pure substance"],"sec":"s3"},{"t":"Mixture of elements","fig":"mix_el","pts":["More than one type of particle","Each particle is an element (single atoms and/or identical-atom molecules)"],"sec":"s3"},{"t":"Mixture of compounds","fig":"mix_comp","pts":["More than one type of particle","Every particle is a molecule of different atoms (but there are 2 different kinds)"],"sec":"s3"},{"t":"Mixture of an element and a compound","fig":"mix_el_comp","pts":["More than one type of particle","Some particles are single atoms (element)","Some particles are identical bonded molecules (compound)"],"sec":"s3"},{"t":"Liquid mixture of two elements","fig":"liquid_mix_el","pts":["Particles close together, random arrangement (liquid)","Two colors of atoms mixed, not bonded to each other",
