":"Dubnium","p":7,"g":5,"c":"transition"},{"z":106,"sym":"Sg","name":"Seaborgium","p":7,"g":6,"c":"transition"},{"z":107,"sym":"Bh","name":"Bohrium","p":7,"g":7,"c":"transition"},{"z":108,"sym":"Hs","name":"Hassium","p":7,"g":8,"c":"transition"},{"z":109,"sym":"Mt","name":"Meitnerium","p":7,"g":9,"c":"transition"},{"z":110,"sym":"Ds","name":"Darmstadtium","p":7,"g":10,"c":"transition"},{"z":111,"sym":"Rg","name":"Roentgenium","p":7,"g":11,"c":"transition"},{"z":112,"sym":"Cn","name":"Copernicium","p":7,"g":12,"c":"transition"},{"z":113,"sym":"Nh","name":"Nihonium","p":7,"g":13,"c":"metal"},{"z":114,"sym":"Fl","name":"Flerovium","p":7,"g":14,"c":"metal"},{"z":115,"sym":"Mc","name":"Moscovium","p":7,"g":15,"c":"metal"},{"z":116,"sym":"Lv","name":"Livermorium","p":7,"g":16,"c":"metal"},{"z":117,"sym":"Ts","name":"Tennessine","p":7,"g":17,"c":"halogen"},{"z":118,"sym":"Og","name":"Oganesson","p":7,"g":18,"c":"noble"}],"review":{"terms":[{"t":"solid","d":"Particles are close together in a fixed lattice, held by very strong attractions; they only vibrate in place. Holds its shape.","fig":"solid"},{"t":"liquid","d":"Particles are close together but slip past one another (temporary attractions). Takes the shape of its container; volume stays constant.","fig":"liquid"},{"t":"gas","d":"Particles are very far apart, move fastest and have no attraction. Fills its container.","fig":"gas"},{"t":"pure substance","d":"Only one type of particle (all identical); fixed composition; one set of characteristic properties; can't be separated by physical means. (Elements and compounds.)","fig":"compound"},{"t":"mixture","d":"More than one type of particle; variable composition; each part keeps its characteristic properties; can be separated by physical means.","fig":"mix_el"},{"t":"element","d":"Pure substance made of only one type of atom; on the periodic table; can't be broken down. Smallest particle is an atom (or a molecule for the diatomic elements).","fig":"el_atoms"},{"t":"compound","d":"Pure substance of 2 or more different elements chemically bonded in a fixed ratio, with a new single set of characteristic properties. All particles identical.","fig":"compound"},{"t":"heterogeneous","d":"May exist in more than one phase and has variable properties in different parts of the sample.","fig":"heterog"},{"t":"homogeneous","d":"One phase only with uniform properties throughout.","fig":"homog"},{"t":"diffusion","d":"Gradual mixing as particles move from an area of high concentration to an area of low concentration.","fig":"diffusion"},{"t":"temperature","d":"A measure of the average kinetic energy of the particles.","fig":"hot_cold"},{"t":"group","d":"A vertical column of the periodic table (18). Elements in a group have similar properties.","fig":"group"},{"t":"period","d":"A horizontal row of the periodic table (7).","fig":"period"},{"t":"location of the families","d":"Alkali metals = Group 1A (far left column, not H); alkaline earth metals = Group 2A; halogens = Group 7A; noble gases = Group 8A (far right column). Use the Periodic Table tab to find them.","fig":null},{"t":"temperature / kinetic energy","d":"Temperature measures the average KE of the particles (KE = ½mv²). Hotter = faster particles = higher average KE.","fig":null},{"t":"thermal expansion","d":"Matter generally expands when heated and contracts when cooled (e.g., power lines sag in summer; water is an exception).","fig":null},{"t":"atom","d":"The smallest particle of an element with unique properties.","fig":null},{"t":"molecule","d":"2 or more atoms chemically combined.","fig":null},{"t":"diatomic elements","d":"Elements that exist as pairs of identical atoms: H₂, N₂, O₂, F₂, Cl₂, Br₂, I₂.","fig":"el_diatomic"}],"items":[{"n":"2","title":"Characteristic properties","prompt":"Define \"characteristic properties\" and list at least 5 examples.","model":"<p><b>Characteristic properties<\/b> are properties that can be used to <b>identify an unknown substance<\/b>.<\/p><p><b>Examples:<\/b> color, solubility in water, boiling point, state of matter at room temperature, viscosity, odor, magnetism (also density and melting point).<\/p>","check":["Defines them as properties that identify a substance","Lists 5 examples (color, solubility, boiling point, state at room temp, viscosity, odor, magnetism)"]},{"n":"3","title":"Identifying and separating mixtures","prompt":"Describe methods for identifying and separating the components of mixtures using characteristic properties, including filtration and distillation. (Think: sand, salt, iron, sulfur, alcohol, water, and the PIVOT lab.)","model":"<ul>\n<li><b>Sand + salt:<\/b> add water – salt <b>dissolves<\/b>, sand doesn't (solubility). <b>Filtration<\/b> traps the sand (particle size); <b>evaporate<\/b> the water to recover the salt (boiling point).<\/li>\n<li><b>Iron + sulfur:<\/b> iron is <b>magnetic<\/b> – use a magnet. (After heating, they become a compound and a magnet no longer works.)<\/li>\n<li><b>Alcohol + water:<\/b> different <b>boiling points<\/b> (alcohol ~75 °C, water 100 °C) – <b>distillation<\/b>: heat, the alcohol vaporizes first, cool it in a condenser to collect it. Alcohol is also <b>flammable<\/b>, water isn't.<\/li>\n<li>Other techniques: chromatography (different rates through a medium), separating funnel (immiscible liquids with different densities).<\/li>\n<\/ul>\n<p class=\"note\">The PIVOT lab was done on the school platform and isn't in the uploaded files – use your own PIVOT notes for that part.<\/p>","check":["Names filtration and distillation and the property each uses","Gives the sand/salt, iron/sulfur and alcohol/water demos","Uses \"characteristic property\" in the explanation"]},{"n":"4","title":"Describe the contents of each container","prompt":"Describe the contents of each cell using atoms, molecules, element, compound, mixture, solid, liquid and gas. Justify your choices. Also answer: What is a molecule? How do you recognize a compound? How can an element have a molecule as its smallest particle? Can a \"particle\" be an atom? A molecule?","img":"q4","model":"<div class=\"tw\"><table class=\"tbl\"><tr><th><\/th><th>A<\/th><th>B<\/th><th>C<\/th><th>D<\/th><\/tr>\n<tr><td>Atoms / molecules / both<\/td><td>Atoms (A)<\/td><td>Both (AMO)<\/td><td>Atoms (A)<\/td><td>Both (AMO)<\/td><\/tr>\n<tr><td>Pure or mixture<\/td><td>Mixture<\/td><td>Mixture<\/td><td>Pure<\/td><td>Mixture<\/td><\/tr>\n<tr><td>Element / compound / both<\/td><td>Element(s)<\/td><td>Elements<\/td><td>Element<\/td><td>Both (EC)<\/td><\/tr>\n<tr><td>Solid / liquid / gas<\/td><td>Liquid<\/td><td>Gas<\/td><td>Solid<\/td><td>Gas<\/td><\/tr><\/table><\/div>\n<ul>\n<li><b>A:<\/b> two kinds of single atoms (black and white), close together with no pattern, not bonded to each other → a <b>liquid mixture of two elements<\/b>.<\/li>\n<li><b>B:<\/b> far apart (gas); gray atoms bonded in identical pairs (diatomic element) plus single white atoms → <b>mixture of elements<\/b>, atoms and molecules.<\/li>\n<li><b>C:<\/b> one kind of atom only, packed close in rows → a <b>solid element<\/b>, pure.<\/li>\n<li><b>D:<\/b> far apart (gas); single white atoms (element) plus identical molecules made of two different atoms bonded (compound) → <b>mixture of an element and a compound<\/b>.<\/li>\n<\/ul>\n<p class=\"note\">C could be read as a liquid or a solid; I read it as a solid because the particles touch in rows. Check with your teacher's answer from the whiteboarding.<\/p>\n<ul><li><b>What is a molecule?<\/b> 2 or more atoms chemically combined.<\/li>\n<li><b>How do you recognize a compound?<\/b> All particles identical, each made of different atoms bonded together in a fixed ratio.<\/li>\n<li><b>How can an element have a molecule as its smallest particle?<\/b> Diatomic elements (e.g., O₂): two identical atoms bonded – still one element.<\/li>\n<li><b>Can a particle be an atom? A molecule?<\/b> Yes to both (atom: Ne, Fe; molecule: O₂, H₂O).<\/li><\/ul>","check":["Uses atoms / molecules / pure / mixture / element / compound correctly for each container","States the state of matter using particle spacing and arrangement","Justifies each choice"]},{"n":"5","title":"Syringe demo","prompt":"Explain how the syringe demonstration gave evidence for the space between particles in a solid, liquid and gas.","model":"<ul>\n<li><b>Gas (air):<\/b> 39 mL compressed to 15 mL when the plunger was pushed and returned to 39 mL afterwards. No air left, so the particles were pushed closer together → <b>lots of space between gas particles<\/b>.<\/li>\n<li><b>Liquid (water):<\/b> 30 mL stayed 30 mL → <b>very little space between liquid particles<\/b>.<\/li>\n<li><b>Solid:<\/b> solids can't be compressed either – their particles are locked close together with very little space between them. (Not demonstrated with the syringe.)<\/li><\/ul>\n<figure class=\"fig wide\"><svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 324 152\" role=\"img\" style=\"width:100%;max-width:486px;height:auto;background:transparent\"><g transform=\"translate(0,0)\"><rect x=\"0.8\" y=\"0.8\" width=\"198.4\" height=\"128.4\" fill=\"#fff\" stroke=\"#111\" stroke-width=\"2\"/><circle cx=\"80.7\" cy=\"40.2\" r=\"9\" fill=\"#111111\" stroke=\"#111\" stroke-width=\"1.6\"/><circle cx=\"167.0\" cy=\"72.2\" r=\"9\" fill=\"#111111\" stroke=\"#111\" stroke-width=\"1.6\"/><circle cx=\"108.6\" cy=\"54.3\" r=\"9\" fill=\"#111111\" stroke=\"#111\" stroke-width=\"1.6\"/><circle cx=\"112.4\" cy=\"90.9\" r=\"9\" fill=\"#111111\" stroke=\"#111\" stroke-width=\"1.6\"/><circle cx=\"44.1\" cy=\"32.8\" r=\"9\" fill=\"#111111\" stroke=\"#111\" stroke-width=\"1.6\"/><circle cx=\"46.1\" cy=\"79.2\" r=\"9\" fill=\"#111111\" stroke=\"#111\" stroke-width=\"1.6\"/><line x1=\"91.0\" y1=\"44.2\" x2=\"104.0\" y2=\"49.4\" stroke=\"#c0392b\" stroke-width=\"1.5\"/><polygon points=\"104.0,49.4 99.5,50.0 101.2,45.8\" fill=\"#c0392b\"/><line x1=\"169.4\" y1=\"61.4\" x2=\"172.4\" y2=\"47.7\" stroke=\"#c0392b\" stroke-width=\"1.5\"/><polygon points=\"172.4,47.7 173.8,52.0 169.4,51.1\" fill=\"#c0392b\"/><line x1=\"119.4\" y1=\"56.6\" x2=\"133.1\" y2=\"59.4\" stroke=\"#c0392b\" stroke-width=\"1.5\"/><polygon points=\"133.1,59.4 128.8,60.8 129.7,56.4\" fill=\"#c0392b\"/><line x1=\"119.8\" y1=\"82.7\" x2=\"129.1\" y2=\"72.3\" stroke=\"#c0392b\" stroke-width=\"1.5\"/><polygon points=\"129.1,72.3 128.2,76.7 124.9,73.7\" fill=\"#c0392b\"/><line x1=\"50.1\" y1=\"23.5\" x2=\"57.7\" y2=\"11.8\" stroke=\"#c0392b\" stroke-width=\"1.5\"/><polygon points=\"57.7,11.8 57.4,16.3 53.7,13.8\" fill=\"#c0392b\"/><line x1=\"48.5\" y1=\"90.0\" x2=\"51.5\" y2=\"103.7\" stroke=\"#c0392b\" stroke-width=\"1.5\"/><polygon points=\"51.5,103.7 48.4,100.3 52.8,99.4\" fill=\"#c0392b\"/><rect x=\"190\" y=\"1\" width=\"9\" height=\"128\" fill=\"#7f8c8d\" stroke=\"#111\" stroke-width=\"1.5\"/><text x=\"100.0\" y=\"147\" text-anchor=\"middle\" font-family=\"Arial,sans-serif\" font-size=\"13\" font-weight=\"bold\" fill=\"#111\">Start (39 mL)<\/text><\/g><g transform=\"translate(224,0)\"><rect x=\"0.8\" y=\"0.8\" width=\"98.4\" height=\"128.4\" fill=\"#fff\" stroke=\"#111\" stroke-width=\"2\"/><circle cx=\"58.6\" cy=\"21.3\" r=\"9\" fill=\"#111111\" stroke=\"#111\" stroke-width=\"1.6\"/><circle cx=\"32.8\" cy=\"86.8\" r=\"9\" fill=\"#111111\" stroke=\"#111\" stroke-width=\"1.6\"/><circle cx=\"32.6\" cy=\"65.5\" r=\"9\" fill=\"#111111\" stroke=\"#111\" stroke-width=\"1.6\"/><circle cx=\"55.5\" cy=\"93.5\" r=\"9\" fill=\"#111111\" stroke=\"#111\" stroke-width=\"1.6\"/><circle cx=\"40.1\" cy=\"33.3\" r=\"9\" fill=\"#111111\" stroke=\"#111\" stroke-width=\"1.6\"/><circle cx=\"64.2\" cy=\"68.3\" r=\"9\" fill=\"#111111\" stroke=\"#111\" stroke-width=\"1.6\"/><line x1=\"50.7\" y1=\"28.9\" x2=\"44.2\" y2=\"35.1\" stroke=\"#c0392b\" stroke-width=\"1.5\"/><polygon points=\"44.2,35.1 45.5,30.8 48.6,34.1\" fill=\"#c0392b\"/><line x1=\"22.4\" y1=\"83.2\" x2=\"13.9\" y2=\"80.3\" stroke=\"#c0392b\" stroke-width=\"1.5\"/><polygon points=\"13.9,80.3 18.3,79.5 16.9,83.7\" fill=\"#c0392b\"/><line x1=\"37.8\" y1=\"55.8\" x2=\"42.1\" y2=\"47.9\" stroke=\"#c0392b\" stroke-width=\"1.5\"/><polygon points=\"42.1,47.9 42.2,52.4 38.3,50.3\" fill=\"#c0392b\"/><line x1=\"47.4\" y1=\"86.0\" x2=\"40.8\" y2=\"79.9\" stroke=\"#c0392b\" stroke-width=\"1.5\"/><polygon points=\"40.8,79.9 45.2,80.9 42.2,84.2\" fill=\"#c0392b\"/><line x1=\"47.2\" y1=\"24.9\" x2=\"53.0\" y2=\"18.0\" stroke=\"#c0392b\" stroke-width=\"1.5\"/><polygon points=\"53.0,18.0 52.2,22.5 48.8,19.6\" fill=\"#c0392b\"/><line x1=\"54.5\" y1=\"63.2\" x2=\"46.6\" y2=\"59.0\" stroke=\"#c0392b\" stroke-width=\"1.5\"/><polygon points=\"46.6,59.0 51.1,58.8 49.0,62.8\" fill=\"#c0392b\"/><rect x=\"90\" y=\"1\" width=\"9\" height=\"128\" fill=\"#7f8c8d\" stroke=\"#111\" stroke-width=\"1.5\"/><text x=\"50.0\" y=\"147\" text-anchor=\"middle\" font-family=\"Arial,sans-serif\" font-size=\"13\" font-weight=\"bold\" fill=\"#111\">Pushed (15 mL)<\/text><\/g><\/svg><figcaption>Gas before and after<\/figcaption><\/figure>","check":["Cites the numbers (39 → 15 mL; 30 mL unchanged)","Claim: gas has lots of space, liquid has little","Reasoning: no particles left, so compression means the space shrank"]},{"n":"6","title":"The pizza scent","prompt":"If Mrs. Heebner walked into the classroom with a hot pizza and it took 3 minutes for the scent to reach the last row, explain at the particle level how the scent diffused. Use diagrams. Key terms: diffusion, random walk, elastic collisions.","model":"<p>The pizza gives off scent particles. They start at a <b>high concentration<\/b> near the pizza. The particles move randomly: each travels in a straight line until it <b>collides elastically<\/b> with an air particle (or another scent particle), and the collision sends it in a new direction – a <b>random walk<\/b>. Because of all the collisions the path is a zig-zag, so even though the particles move hundreds of miles per hour, the <b>net movement<\/b> from the high-concentration area (the pizza) to the low-concentration area (the back row) is slow. This <b>diffusion<\/b> took about 3 minutes for the scent to reach the last row. Students closest smelled it first.<\/p>\n<figure class=\"fig wide\"><svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 396 142\" role=\"img\" style=\"width:100%;max-width:594px;height:auto;background:transparent\"><g transform=\"translate(0,0)\"><rect x=\"0.8\" y=\"0.8\" width=\"188.4\" height=\"118.4\" fill=\"#fff\" stroke=\"#111\" stroke-width=\"2\"/><circle cx=\"26.7\" cy=\"32.3\" r=\"9\" fill=\"#111111\" stroke=\"#111\" stroke-width=\"1.6\"/><circle cx=\"28.0\" cy=\"95.0\" r=\"9\" fill=\"#111111\" stroke=\"#111\" stroke-width=\"1.6\"/><circle cx=\"32.9\" cy=\"63.9\" r=\"9\" fill=\"#111111\" stroke=\"#111\" stroke-width=\"1.6\"/><circle cx=\"15.1\" cy=\"75.7\" r=\"9\" fill=\"#111111\" stroke=\"#111\" stroke-width=\"1.6\"/><circle cx=\"14.5\" cy=\"52.9\" r=\"9\" fill=\"#111111\" stroke=\"#111\" stroke-width=\"1.6\"/><circle cx=\"107.9\" cy=\"31.6\" r=\"9\" fill=\"#ffffff\" stroke=\"#111\" stroke-width=\"1.6\"/><circle cx=\"133.7\" cy=\"89.3\" r=\"9\" fill=\"#ffffff\" stroke=\"#111\" stroke-width=\"1.6\"/><circle cx=\"146.7\" cy=\"45.0\" r=\"9\" fill=\"#ffffff\" stroke=\"#111\" stroke-width=\"1.6\"/><circle cx=\"100.5\" cy=\"94.3\" r=\"9\" fill=\"#ffffff\" stroke=\"#111\" stroke-width=\"1.6\"/><circle cx=\"161.6\" cy=\"65.2\" r=\"9\" fill=\"#ffffff\" stroke=\"#111\" stroke-width=\"1.6\"/><circle cx=\"165.3\" cy=\"23.5\" r=\"9\" fill=\"#ffffff\" stroke=\"#111\" stroke-width=\"1.6\"/><circle cx=\"71.9\" cy=\"72.3\" r=\"9\" fill=\"#ffffff\" stroke=\"#111\" stroke-width=\"1.6\"/><text x=\"95.0\" y=\"137\" text-anchor=\"middle\" font-family=\"Arial,sans-serif\" font-size=\"13\" font-weight=\"bold\" fill=\"#111\">Start<\/text><\/g><g transform=\"translate(206,0)\"><rect x=\"0.8\" y=\"0.8\" width=\"188.4\" height=\"118.4\" fill=\"#fff\" stroke=\"#111\" stroke-width=\"2\"/><circle cx=\"167.7\" cy=\"23.5\" r=\"9\" fill=\"#111111\" stroke=\"#111\" stroke-width=\"1.6\"/><circle cx=\"92.5\" cy=\"96.2\" r=\"9\" fill=\"#111111\" stroke=\"#111\" stroke-width=\"1.6\"/><circle cx=\"170.2\" cy=\"52.9\" r=\"9\" fill=\"#111111\" stroke=\"#111\" stroke-width=\"1.6\"/><circle cx=\"71.6\" cy=\"70.7\" r=\"9\" fill=\"#111111\" stroke=\"#111\" stroke-width=\"1.6\"/><circle cx=\"77.9\" cy=\"19.9\" r=\"9\" fill=\"#111111\" stroke=\"#111\" stroke-width=\"1.6\"/><circle cx=\"44.9\" cy=\"37.9\" r=\"9\" fill=\"#ffffff\" stroke=\"#111\" stroke-width=\"1.6\"/><circle cx=\"137.3\" cy=\"53.1\" r=\"9\" fill=\"#ffffff\" stroke=\"#111\" stroke-width=\"1.6\"/><circle cx=\"155.6\" cy=\"92.4\" r=\"9\" fill=\"#ffffff\" stroke=\"#111\" stroke-width=\"1.6\"/><circle cx=\"106.5\" cy=\"74.0\" r=\"9\" fill=\"#ffffff\" stroke=\"#111\" stroke-width=\"1.6\"/><circle cx=\"101.6\" cy=\"30.7\" r=\"9\" fill=\"#ffffff\" stroke=\"#111\" stroke-width=\"1.6\"/><circle cx=\"23.3\" cy=\"19.4\" r=\"9\" fill=\"#ffffff\" stroke=\"#111\" stroke-width=\"1.6\"/><circle cx=\"129.1\" cy=\"93.0\" r=\"9\" fill=\"#ffffff\" stroke=\"#111\" stroke-width=\"1.6\"/><text x=\"95.0\" y=\"137\" text-anchor=\"middle\" font-family=\"Arial,sans-serif\" font-size=\"13\" font-weight=\"bold\" fill=\"#111\">Later<\/text><\/g><\/svg><figcaption>Scent (black) spreading<\/figcaption><\/figure>","check":["Uses diffusion, random walk and elastic collisions","High → low concentration","Explains why it takes time (collisions change direction)","Includes a particle diagram (concentrated at first, spread out later)"]},{"n":"7","title":"Hot vs. cold food dye","prompt":"(a) In the hot vs. cold water demo, why did the food coloring diffuse differently? Use diagrams. Key terms: diffusion, kinetic energy, temperature. (b) In which liquid do the particles have a higher average kinetic energy? Explain.","model":"<p><b>(a)<\/b> The red (warm) water was at 50 °C and the dye mixed faster and better; the blue (cold) water was at 11 °C and took about 15 minutes and was still not fully mixed. <b>Temperature<\/b> measures the <b>average kinetic energy<\/b> of the particles. In the warm water the particles had <b>higher average KE<\/b>, so they moved faster and collided more often, so the dye <b>diffused<\/b> faster.<\/p>\n<figure class=\"fig wide\"><svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 356 152\" role=\"img\" style=\"width:100%;max-width:534px;height:auto;background:transparent\"><g transform=\"translate(0,0)\"><rect x=\"0.8\" y=\"0.8\" width=\"168.4\" height=\"128.4\" fill=\"#fff\" stroke=\"#111\" stroke-width=\"2\"/><circle cx=\"20.6\" cy=\"29.3\" r=\"9\" fill=\"#111111\" stroke=\"#111\" stroke-width=\"1.6\"/><circle cx=\"109.3\" cy=\"31.8\" r=\"9\" fill=\"#111111\" stroke=\"#111\" stroke-width=\"1.6\"/><circle cx=\"49.6\" cy=\"88.7\" r=\"9\" fill=\"#111111\" stroke=\"#111\" stroke-width=\"1.6\"/><circle cx=\"116.8\" cy=\"79.9\" r=\"9\" fill=\"#111111\" stroke=\"#111\" stroke-width=\"1.6\"/><circle cx=\"89.7\" cy=\"60.2\" r=\"9\" fill=\"#111111\" stroke=\"#111\" stroke-width=\"1.6\"/><circle cx=\"150.5\" cy=\"27.6\" r=\"9\" fill=\"#111111\" stroke=\"#111\" stroke-width=\"1.6\"/><line x1=\"30.8\" y1=\"25.3\" x2=\"37.3\" y2=\"22.7\" stroke=\"#c0392b\" stroke-width=\"1.5\"/><polygon points=\"37.3,22.7 34.6,26.2 32.9,22.0\" fill=\"#c0392b\"/><line x1=\"100.3\" y1=\"38.1\" x2=\"94.5\" y2=\"42.1\" stroke=\"#c0392b\" stroke-width=\"1.5\"/><polygon points=\"94.5,42.1 96.4,38.0 99.0,41.7\" fill=\"#c0392b\"/><line x1=\"53.1\" y1=\"99.1\" x2=\"55.3\" y2=\"105.8\" stroke=\"#c0392b\" stroke-width=\"1.5\"/><polygon points=\"55.3,105.8 51.9,102.8 56.2,101.4\" fill=\"#c0392b\"/><line x1=\"111.4\" y1=\"89.5\" x2=\"108.1\" y2=\"95.7\" stroke=\"#c0392b\" stroke-width=\"1.5\"/><polygon points=\"108.1,95.7 108.0,91.2 111.9,93.4\" fill=\"#c0392b\"/><line x1=\"82.4\" y1=\"68.4\" x2=\"77.8\" y2=\"73.7\" stroke=\"#c0392b\" stroke-width=\"1.5\"/><polygon points=\"77.8,73.7 78.7,69.3 82.1,72.3\" fill=\"#c0392b\"/><line x1=\"161.1\" y1=\"24.5\" x2=\"167.8\" y2=\"22.6\" stroke=\"#c0392b\" stroke-width=\"1.5\"/><polygon points=\"167.8,22.6 164.7,25.8 163.4,21.5\" fill=\"#c0392b\"/><text x=\"85.0\" y=\"147\" text-anchor=\"middle\" font-family=\"Arial,sans-serif\" font-size=\"13\" font-weight=\"bold\" fill=\"#111\">Cold (slow)<\/text><\/g><g transform=\"translate(186,0)\"><rect x=\"0.8\" y=\"0.8\" width=\"168.4\" height=\"128.4\" fill=\"#fff\" stroke=\"#111\" stroke-width=\"2\"/><circle cx=\"29.2\" cy=\"38.7\" r=\"9\" fill=\"#111111\" stroke=\"#111\" stroke-width=\"1.6\"/><circle cx=\"137.8\" cy=\"64.7\" r=\"9\" fill=\"#111111\" stroke=\"#111\" stroke-width=\"1.6\"/><circle cx=\"32.2\" cy=\"65.8\" r=\"9\" fill=\"#111111\" stroke=\"#111\" stroke-width=\"1.6\"/><circle cx=\"88.0\" cy=\"105.9\" r=\"9\" fill=\"#111111\" stroke=\"#111\" stroke-width=\"1.6\"/><circle cx=\"68.0\" cy=\"19.1\" r=\"9\" fill=\"#111111\" stroke=\"#111\" stroke-width=\"1.6\"/><circle cx=\"115.5\" cy=\"96.5\" r=\"9\" fill=\"#111111\" stroke=\"#111\" stroke-width=\"1.6\"/><line x1=\"39.8\" y1=\"35.5\" x2=\"62.7\" y2=\"28.6\" stroke=\"#c0392b\" stroke-width=\"1.5\"/><polygon points=\"62.7,28.6 59.6,31.8 58.4,27.5\" fill=\"#c0392b\"/><line x1=\"141.1\" y1=\"75.2\" x2=\"148.3\" y2=\"98.1\" stroke=\"#c0392b\" stroke-width=\"1.5\"/><polygon points=\"148.3,98.1 145.0,95.0 149.3,93.7\" fill=\"#c0392b\"/><line x1=\"41.8\" y1=\"71.2\" x2=\"62.7\" y2=\"83.0\" stroke=\"#c0392b\" stroke-width=\"1.5\"/><polygon points=\"62.7,83.0 58.2,83.0 60.4,79.1\" fill=\"#c0392b\"/><line x1=\"96.0\" y1=\"113.5\" x2=\"113.4\" y2=\"130.0\" stroke=\"#c0392b\" stroke-width=\"1.5\"/><polygon points=\"113.4,130.0 109.0,128.9 112.1,125.7\" fill=\"#c0392b\"/><line x1=\"78.9\" y1=\"17.5\" x2=\"102.6\" y2=\"14.2\" stroke=\"#c0392b\" stroke-width=\"1.5\"/><polygon points=\"102.6,14.2 99.1,17.0 98.5,12.5\" fill=\"#c0392b\"/><line x1=\"123.8\" y1=\"103.7\" x2=\"142.1\" y2=\"119.2\" stroke=\"#c0392b\" stroke-width=\"1.5\"/><polygon points=\"142.1,119.2 137.7,118.4 140.6,114.9\" fill=\"#c0392b\"/><text x=\"85.0\" y=\"147\" text-anchor=\"middle\" font-family=\"Arial,sans-serif\" font-size=\"13\" font-weight=\"bold\" fill=\"#111\">Hot (fast)<\/text><\/g><\/svg><figcaption>Cold (short arrows) vs. hot (long arrows)<\/figcaption><\/figure>\n<p><b>(b)<\/b> The <b>hot water<\/b> has the higher average KE, because a higher temperature means the particles are moving faster (KE = ½mv²).<\/p>","check":["Cites the data (50 °C vs. 11 °C; faster vs. slower)","Temperature = average KE; faster particles","Diagram with longer arrows for hot","Part (b): hot water, because faster particles"]},{"n":"10","title":"Writing chemical formulas","prompt":"Write the chemical formula to represent different particles. Black circles = element X, gray = element Y, white = element Z.","img":"q10","model":"<p>Count the atoms of each color in <b>one<\/b> particle that is touching, and use subscripts:<\/p>\n<ul><li>Three black atoms bonded to one white atom → <b>X₃Z<\/b><\/li>\n<li>One black atom bonded to one white atom (two of these) → <b>XZ<\/b><\/li>\n<li>Two gray atoms bonded together → <b>Y₂<\/b><\/li>\n<li>Single white atoms (not touching anything) → <b>Z<\/b><\/li><\/ul>\n<p class=\"note\">The picture shows several different particles. If your teacher wants a single formula, ask which particle they mean. Check my reading of which circles touch against the original.<\/p>","check":["Counts atoms in each bonded particle","Writes subscripts (X₃Z, not X3Z or 3XZ)","Single atoms are just the symbol"]}]},"tests":[[{"q":"Students closest to the cologne smelled it first. This is evidence for...","o":["a chemical change","particles not moving","diffusion from high to low concentration","particles disappearing"],"a":2,"w":"The concentration was highest near the spray.","sec":"s2"},{"q":"What is the correct procedure to separate sand and salt?","o":["Add water, filter out the sand, evaporate the water","Distill the dry mixture","Burn the mixture","Use a magnet"],"a":0,"w":"Salt dissolves; sand is filtered out.","sec":"s4"},{"q":"The halogens are in Group...","o":["2A","1A","7A","8A"],"a":2,"w":"7A.","sec":"s5"},{"q":"This diagram shows a...","o":["solid","liquid","mixture","gas"],"a":0,"w":"Particles touching in an organized lattice = solid.","svg":"solid","sec":"s1"},{"q":"This diagram shows a...","o":["gas","liquid","compound","solid"],"a":0,"w":"Far apart with fast motion = gas.","svg":"gas","sec":"s1"},{"q":"Which observation is the best EVIDENCE that gas particles have a lot of space between them?","o":["Gas particles do not attract each other","Gas fills its container","Air in a syringe was compressed from 39 mL to 15 mL","Gas particles move fast"],"a":2,"w":"Evidence is an observation or measurement; the other options are claims about particles.","sec":"s1"},{"q":"This container is a...","o":["gas mixture of two compounds","liquid mixture of two elements","solid element","solid compound"],"a":1,"w":"Close together and random (liquid) with two kinds of atoms that are not bonded.","svg":"liquid_mix_el","sec":"s3"},{"q":"This container is...","o":["a mixture of elements","a compound","a mixture of compounds","an element (diatomic molecules)"],"a":3,"w":"Identical molecules of two identical atoms = diatomic element.","svg":"el_diatomic","sec":"s3"},{"q":"This container is...","o":["a mixture of elements","an element","a mixture of compounds","a compound"],"a":3,"w":"All particles identical, each made of two different atoms bonded.","svg":"compound_xw","sec":"s3"},{"q":"How many periods are there on the periodic table?","o":["8","7","18","118"],"a":1,"w":"7 periods (rows).","sec":"s5"},{"q":"This diagram shows a...","o":["liquid","solid","compound","gas"],"a":0,"w":"Close together but irregular, with arrows showing particles slipping past each other = liquid.","svg":"liquid","sec":"s1"},{"q":"This container is...","o":["a mixture of elements","a compound","a mixture of compounds","an element"],"a":3,"w":"All particles are identical single atoms of one color.","svg":"el_atoms","sec":"s3"},{"q":"Why does a gas particle's path look like a zig-zag?","o":["It is attracted to the walls","It is slowing to a stop","It is moving in a circle","It changes direction every time it collides with another particle"],"a":3,"w":"Collisions change direction – a random walk.","sec":"s2"},{"q":"Distillation separates liquids by a difference in...","o":["magnetism","particle size only","color","boiling point"],"a":3,"w":"The lower-boiling liquid vaporizes first.","sec":"s4"},{"q":"This container is...","o":["a mixture of elements","a compound","an element","a mixture of compounds"],"a":3,"w":"Two different kinds of molecules, both made of different atoms bonded.","svg":"mix_comp","sec":"s3"},{"q":"This container is...","o":["a mixture of elements","a compound","an element","a mixture of an element and a compound"],"a":3,"w":"Single atoms (element) mixed with identical bonded molecules (compound).","svg":"mix_el_comp2","sec":"s3"},{"q":"Which change would make perfume diffuse faster across a room?","o":["Lowering the temperature of the room","Closing the bottle","Raising the temperature of the room","Using fewer particles of air"],"a":2,"w":"Higher temperature = faster particles = faster diffusion.","sec":"s2"},{"q":"Metalloids are found...","o":["on the far left","in the B groups","along the staircase between metals and nonmetals","in Group 8A"],"a":2,"w":"Staircase.","sec":"s5"},{"q":"Which is NOT a characteristic property?","o":["Boiling point","Color","The mass of the sample","Solubility in water"],"a":2,"w":"Mass of a sample depends on how much you have.","sec":"s4"},{"q":"Diffusion is the movement of particles from...","o":["high concentration to low concentration","hot to cold only","solid to gas","low concentration to high concentration"],"a":0,"w":"Net movement is from high to low concentration.","sec":"s2"}],[{"q":"Which two containers in this picture contain ONLY compounds?","o":["B and C","A and C","A and D","B and D"],"a":0,"w":"B (liquid) and C (gas) have identical bonded molecules of different atoms; A and D are single elements.","img":"d8","sec":"s3"},{"q":"Which is a typical property of metals?","o":["Usually gases at room temperature","Malleable and ductile","Poor conductors","Brittle as solids"],"a":1,"w":"Metals can be pounded and drawn into wires.","sec":"s5"},{"q":"Which statement shows that a compound has NEW properties?","o":["Iron stays magnetic in a mixture with sulfur","Sodium and chlorine make table salt with its own single color and boiling point","Sand and salt can be separated","Alcohol burns when mixed with water"],"a":1,"w":"A new single set of properties.","sec":"s4"},{"q":"Container D in this diagram is a...","o":["liquid: a mixture of two elements","gas: a pure compound","solid element","gas: a mixture of an element and a compound"],"a":3,"w":"Far apart (gas) with single atoms (element) and molecules of two different atoms (compound).","img":"q4","sec":"s3"},{"q":"In an elastic collision...","o":["the total energy is conserved","the particles join together","energy is lost as heat","both particles stop"],"a":0,"w":"Energy may transfer between the particles but the total is conserved.","sec":"s1"},{"q":"According to KMT, gas particles travel in ____ until they collide.","o":["zig-zags only","straight lines","spirals","circles"],"a":1,"w":"Straight lines; the collisions cause the zig-zag path.","sec":"s1"},{"q":"Which is a claim supported by the food-dye demo?","o":["Dye particles are heavier than water particles","Particle speed depends on temperature","Particles stop moving when cold","Only hot water has particles"],"a":1,"w":"The dye diffused faster at the higher temperature.","sec":"s2"},{"q":"Which is an example of thermal expansion?","o":["Power lines sag in warm weather","Salt dissolving in water","Perfume spreading across a room","Iron rusting"],"a":0,"w":"Things expand when hotter.","sec":"s2"},{"q":"Temperature is a measure of the ____ of the particles.","o":["number","average kinetic energy","mass","size"],"a":1,"w":"Temperature = average KE.","sec":"s2"},{"q":"Which property would be MOST useful for identifying an unknown liquid?","o":["The label on the beaker","Its volume","The size of its container","Its boiling point"],"a":3,"w":"Boiling point is characteristic.","sec":"s4"},{"q":"In this picture, which container contains only a diatomic ELEMENT?","o":["D","C","A","B"],"a":1,"w":"Identical pairs of the same (white) atom.","img":"d6","sec":"s3"},{"q":"Which state has the weakest forces of attraction between particles?","o":["They are all the same","Liquid","Gas","Solid"],"a":2,"w":"Gas particles have essentially no attraction.","sec":"s1"},{"q":"In this picture, which container is a pure substance that is a COMPOUND?","o":["C","B","D","A"],"a":3,"w":"Container A has identical molecules, each made of different atoms bonded.","img":"d6","sec":"s3"},{"q":"Container D in this picture is...","o":["a compound","a mixture of two compounds","an element","a mixture of two elements"],"a":1,"w":"There are two different kinds of molecules, each with different atoms bonded.","img":"d6","sec":"s3"},{"q":"Which statement about the particles of a SOLID is correct?","o":["They vibrate in place but can't move past each other","They have no attractions","They are far apart","They move freely and independently"],"a":0,"w":"Strong attractions lock solid particles in a lattice.","sec":"s1"},{"q":"A magnet separates iron from an iron + sulfur MIXTURE because...","o":["iron keeps its characteristic property of magnetism in a mixture","the mixture is a compound","sulfur is magnetic","iron dissolves"],"a":0,"w":"Mixtures retain properties.","sec":"s4"},{"q":"Container D in this picture is a...","o":["liquid compound","solid element","gas mixture","solid compound"],"a":1,"w":"One kind of atom in a regular lattice.","img":"d7","sec":"s3"},{"q":"Which element is an alkali metal?","o":["Calcium (Ca)","Sodium (Na)","Chlorine (Cl)","Neon (Ne)"],"a":1,"w":"Na is in Group 1A.","sec":"s5"},{"q":"Compared with particles in 11 °C water, particles in 50 °C water have...","o":["no kinetic energy","higher average kinetic energy","lower average kinetic energy","the same kinetic energy"],"a":1,"w":"Higher temperature = higher average KE.","sec":"s2"},{"q":"Iron (Fe) is a...","o":["noble gas","transition metal","nonmetal","semimetal"],"a":1,"w":"Fe is in the B groups.","sec":"s5"}],[{"q":"Which statement about mixtures is TRUE?","o":["They have fixed composition","They have one set of new properties","They are chemically bonded","They can be separated by physical means"],"a":3,"w":"Mixtures can be separated physically.","sec":"s4"},{"q":"Which of these is NOT a diatomic element?","o":["He","Cl₂","O₂","N₂"],"a":0,"w":"Helium exists as single atoms.","sec":"s3"},{"q":"Two flasks of water, one at 21 °C and one at 50 °C, each get a drop of food dye. Which will be fully mixed first?","o":["The 21 °C flask","They mix at the same rate","Neither will mix","The 50 °C flask"],"a":3,"w":"Faster particles at the higher temperature.","sec":"s2"},{"q":"In a CER about the syringe, which sentence is the REASONING?","o":["The volume went from 39 mL to 15 mL.","The gas has a lot of space between particles.","Because the volume decreased without any air leaving, the particles must have been pushed closer, so there was space between them.","We pushed the plunger."],"a":2,"w":"Reasoning explains how the evidence supports the claim.","sec":"s1"},{"q":"Which container shows the COMPOUND of iron and sulfur?","o":["The one on the left","The one on the right","Neither","Both"],"a":1,"w":"Bonded Fe–S particles, all identical = compound; separate atoms = mixture.","svg":"fe_s","sec":"s4"},{"q":"Why can't you pour a solid the way you pour a liquid?","o":["Its particles have no attractions","Its particles are locked in a lattice by strong attractions","Its particles move fastest","Its particles are far apart"],"a":1,"w":"Solid particles can't move past each other.","sec":"s1"},{"q":"Which technique separates two non-mixing liquids with different densities?","o":["Magnet","Evaporation","Separating funnel","Filtration"],"a":2,"w":"Immiscible liquids layer by density.","sec":"s4"},{"q":"When the plunger of an air-filled syringe is pushed, which does NOT change?","o":["The pressure","The volume of the gas","The number of gas particles in the syringe","The space between particles"],"a":2,"w":"No air left the syringe; the particles were just pushed closer.","sec":"s1"},{"q":"Which formula represents ONE particle made of three black atoms (X) bonded to one white atom (Z)?","o":["XZ₃","X₃Z","X₃Z₃","3XZ"],"a":1,"w":"Subscripts count atoms: X₃Z.","img":"q10","sec":"s3"},{"q":"Which description fits a liquid?","o":["A definite shape and volume","A definite volume but the shape of its container","No definite shape or volume","It can be compressed easily"],"a":1,"w":"Liquids keep their volume but take the shape of the container.","sec":"s1"},{"q":"The Periodic Law says properties repeat when elements are ordered by increasing...","o":["mass only","density","name","atomic number"],"a":3,"w":"Atomic number.","sec":"s5"},{"q":"Which describes a pure substance?","o":["Can always be separated by filtering","Only one type of particle","More than one type of particle","Variable composition"],"a":1,"w":"All particles identical.","sec":"s3"},{"q":"This diagram shows...","o":["filtration","diffusion: particles spreading from high to low concentration","a compound forming","thermal expansion"],"a":1,"w":"The perfume particles (black) start concentrated and later are spread evenly.","svg":"diffusion","sec":"s2"},{"q":"Which is a HETEROGENEOUS mixture?","o":["Sand and water","Oxygen gas","Salt dissolved in water","Pure gold"],"a":0,"w":"Sand sinks and stays separate – more than one phase with variable properties.","sec":"s3"},{"q":"Which element is a noble gas?","o":["Krypton (Kr)","Chromium (Cr)","Potassium (K)","Carbon (C)"],"a":0,"w":"Kr is in 8A.","sec":"s5"},{"q":"Which is TRUE of a compound but NOT a mixture?","o":["It can be separated with a filter","It has more than one type of particle","Its elements are bonded in a fixed ratio","Its parts keep their own properties"],"a":2,"w":"Compounds have fixed composition.","sec":"s3"},{"q":"Hydrogen is in Group 1A but is classified as a...","o":["alkali metal","transition metal","nonmetal","semimetal"],"a":2,"w":"Hydrogen is a nonmetal.","sec":"s5"},{"q":"Which pair of terms best explains why a smell takes minutes to cross a room even though gas particles are very fast?","o":["Atom and molecule","Group and period","Collisions and random walk","Filtration and evaporation"],"a":2,"w":"Constant collisions mean the net spread is slow.","sec":"s2"},{"q":"\"You can't have an atom of a ____.\"","o":["element","metal","compound","noble gas"],"a":2,"w":"A compound's smallest particle is a molecule.","sec":"s3"},{"q":"Unlike most substances, water...","o":["contracts when it gets colder","never changes volume","expands when it gets colder","does not have particles"],"a":2,"w":"Water expands as it cools toward freezing.","sec":"s2"}]]}</script>
<script>
(function(){
'use strict';
var D=JSON.parse(document.getElementById('gdata').textContent);
var LS={get:function(k,d){try{var v=window.localStorage.getItem('chem1_'+k);return v===null?d:JSON.parse(v);}catch(e){return d;}},set:function(k,v){try{window.localStorage.setItem('chem1_'+k,JSON.stringify(v));}catch(e){}}};
var ANS=LS.get('ans',{});
var KNOWN=LS.get('known',{});
var BEST=LS.get('best',{});
var QMAP={};
var S={tab:'learn',sec:'s1',deck:'vocab',filter:'all',mode:'a',idx:0,flip:false,hideKnown:false,order:null,
       ptview:'type',ptonly:false,ptsel:null,game:null,gscore:{ok:0,n:0},
       test:null,tsel:{},tdone:false};
var app=document.getElementById('app');
function el(h){var t=document.createElement('div');t.innerHTML=h;return t;}
function secById(id){for(var i=0;i<D.sections.length;i++)if(D.sections[i].id===id)return D.sections[i];return null;}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function save(){LS.set('ans',ANS);LS.set('known',KNOWN);LS.set('best',BEST);}

/* ---------- questions ---------- */
function qHTML(q,id,opt){
  opt=opt||{};QMAP[id]=q;
  var a=ANS[id];
  if(opt.test){a=undefined;}
  var out='<div class="q" data-qid="'+id+'"><div class="qt">'+(opt.num?opt.num+'. ':'')+q.q+'</div>';
  if(q.svg&&D.figs[q.svg])out+='<div class="qfig">'+D.figs[q.svg]+'</div>';
  if(q.img&&D.img[q.img])out+='<div class="qfig"><img alt="Diagram from the worksheet" src="'+D.img[q.img]+'"></div>';
  out+='<div class="opts">';
  for(var i=0;i<q.o.length;i++){
    var cls='opt',dis='';
    if(opt.test){
      if(S.tdone){dis=' disabled';if(i===q.a)cls+=' right';else if(S.tsel[id]===i)cls+=' wrong';}
      else if(S.tsel[id]===i)cls+=' sel';
    }else if(a!==undefined){dis=' disabled';if(i===q.a)cls+=' right';else if(i===a)cls+=' wrong';}
    out+='<button class="'+cls+'" data-act="'+(opt.test?'tsel':'ans')+'" data-qid="'+id+'" data-i="'+i+'"'+dis+'>'+q.o[i]+'</button>';
  }
  out+='</div>';
  var show=false,msg='';
  if(opt.test){if(S.tdone){show=true;var ok=S.tsel[id]===q.a;msg=(S.tsel[id]===undefined?'<b>Not answered.</b> ':ok?'<b>Correct.</b> ':'<b>Not quite.</b> ')+q.w;}}
  else if(a!==undefined){show=true;msg=(a===q.a?'<b>Correct.</b> ':'<b>Not quite.</b> ')+q.w;}
  out+='<div class="why'+(show?' show':'')+'">'+msg+'</div></div>';
  return out;
}

/* ---------- LEARN ---------- */
function renderLearn(){
  var s=secById(S.sec);var h='<div class="pills">';
  D.sections.forEach(function(x){h+='<button class="pill'+(x.id===S.sec?' on':'')+'" style="--c:'+x.color+'" data-act="sec" data-id="'+x.id+'">'+x.num+'. '+x.title+'</button>';});
  h+='</div><div class="sec-head" style="--c:'+s.color+';border-color:'+s.color+'"><h2>'+s.num+'. '+s.title+'</h2><div class="tag">'+s.tag+'</div><p>'+s.intro+'</p></div>';
  s.lessons.forEach(function(L){
    h+='<section class="lesson" id="'+L.id+'"><h3>'+L.title+'</h3><div class="lbody">'+L.html+'</div>';
    if(L.checks.length){h+='<div class="checks"><h4>Check-in</h4>';L.checks.forEach(function(q,i){h+=qHTML(q,'c:'+L.id+':'+i);});h+='</div>';}
    h+='</section>';
  });
  h+='<section class="lesson" id="quiz-'+s.id+'"><h3>Section '+s.num+' quiz</h3>';
  s.quiz.forEach(function(q,i){h+=qHTML(q,'q:'+s.id+':'+i,{num:i+1});});
  h+='<div class="score" id="score">'+quizScore(s)+'</div><div class="row"><button class="btn alt" data-act="resetquiz" data-id="'+s.id+'">Reset this quiz</button></div></section>';
  var idx=D.sections.indexOf(s);
  h+='<div class="row">';
  if(idx>0)h+='<button class="btn alt" data-act="sec" data-id="'+D.sections[idx-1].id+'">← Section '+D.sections[idx-1].num+'</button>';
  if(idx<D.sections.length-1)h+='<button class="btn" data-act="sec" data-id="'+D.sections[idx+1].id+'">Section '+D.sections[idx+1].num+' →</button>';
  h+='</div>';
  app.innerHTML=h;
  fillElementList();
}
function quizScore(s){var n=0,ok=0;s.quiz.forEach(function(q,i){var a=ANS['q:'+s.id+':'+i];if(a!==undefined){n++;if(a===q.a)ok++;}});return n===0?'Answer the questions above to see your score.':'Score so far: '+ok+' / '+s.quiz.length+(n===s.quiz.length?(ok===s.quiz.length?' 🎉':' – review the lessons for any you missed.'):'');}
function fillElementList(){
  var box=document.getElementById('elementlist');if(!box)return;
  var groups={M:[],TM:[],SM:[],NM:[]};
  D.elements.forEach(function(e){groups[e.t].push(e);});
  var names={M:'Metals (M)',TM:'Transition metals (TM)',SM:'Semimetals (SM)',NM:'Nonmetals (NM)'};
  var h='';
  ['M','TM','SM','NM'].forEach(function(k){h+='<h4>'+names[k]+'</h4><div class="elgrid">';groups[k].forEach(function(e){h+='<div><span>'+e.n+'</span><b>'+e.s+'</b></div>';});h+='</div>';});
  box.innerHTML=h;
}

/* ---------- REVIEW ---------- */
function renderReview(){
  var h='<h2>Unit 1 Review packet – model answers</h2><p class="note">Try each item on paper first, then open it to compare. Numbering matches your packet (the packet skips #8 and #9).</p>';
  h+='<h3>#1 Define / describe each term (and draw a particle diagram if applicable)</h3><div class="termgrid">';
  D.review.terms.forEach(function(t){h+='<details><summary>'+t.t+'</summary><div>'+t.d+(t.fig?'<figure class="fig">'+D.figs[t.fig]+'</figure>':'')+'</div></details>';});
  h+='</div>';
  D.review.items.forEach(function(it){
    h+='<details><summary>#'+it.n+' · '+it.title+'</summary><p><b>'+it.prompt+'</b></p>';
    if(it.img)h+='<div class="qfig"><img alt="Diagram from the review packet" src="'+D.img[it.img]+'"></div>';
    h+='<div>'+it.model+'</div><h4>Your answer should include</h4><ul class="chk">';
    it.check.forEach(function(c){h+='<li>'+c+'</li>';});h+='</ul></details>';
  });
  app.innerHTML=h;
}

/* ---------- FLASHCARDS ---------- */
function getCards(){
  var out=[];
  if(S.deck==='vocab'){D.vocab.forEach(function(v){if(S.filter==='all'||v.sec===S.filter)out.push({id:'v:'+v.t,sec:v.sec,f:'<div class="big">'+v.t+'</div>',b:'<div class="def">'+v.d+'</div>',f2:'<div class="def">'+v.d+'</div>',b2:'<div class="big">'+v.t+'</div>'});});}
  else if(S.deck==='diag'){D.diag.forEach(function(v){if(S.filter==='all'||v.sec===S.filter){var fig='<div class="qfig">'+D.figs[v.fig]+'</div>';var bl='<ul>'+v.pts.map(function(p){return '<li>'+p+'</li>';}).join('')+'</ul>';
    out.push({id:'d:'+v.t,sec:v.sec,f:'<div class="big">'+v.t+'</div><div class="sub">Picture it – then flip</div>',b:fig+bl,f2:fig+'<div class="sub">What is this?</div>',b2:'<div class="big">'+v.t+'</div>'+bl});}});}
  else{D.elements.forEach(function(e){if(S.filter==='all'||e.t===S.filter){
    var info='<div class="big">'+e.s+'</div><div class="def">'+e.tw+'</div>'+(e.fam?'<div class="sub">'+e.fam+'</div>':'')+(e.dia?'<div class="sub">Diatomic element: '+e.dia+'</div>':'');
    var info2='<div class="big">'+e.n+'</div><div class="def">'+e.tw+'</div>'+(e.fam?'<div class="sub">'+e.fam+'</div>':'')+(e.dia?'<div class="sub">Diatomic element: '+e.dia+'</div>':'');
    out.push({id:'e:'+e.s,sec:e.t,f:'<div class="big">'+e.n+'</div><div class="sub">symbol + type?</div>',b:info,f2:'<div class="big">'+e.s+'</div><div class="sub">name + type?</div>',b2:info2});}});}
  if(S.hideKnown)out=out.filter(function(c){return !KNOWN[c.id];});
  return out;
}
function renderCards(){
  var cards=getCards();
  var all=0,kn=0;var tmp=S.hideKnown;S.hideKnown=false;var full=getCards();S.hideKnown=tmp;full.forEach(function(c){all++;if(KNOWN[c.id])kn++;});
  if(!S.order||S.order.length!==cards.length||S.order._k!==S.deck+S.filter+S.hideKnown){S.order=cards.map(function(c,i){return i;});S.order._k=S.deck+S.filter+S.hideKnown;if(S.idx>=cards.length)S.idx=0;}
  var h='<h2>Flashcards</h2><div class="row">';
  [['vocab','Vocabulary (definitions)'],['diag','Particle diagrams'],['elem','Periodic table: symbols &amp; types']].forEach(function(d){h+='<button class="chip'+(S.deck===d[0]?' on':'')+'" data-act="deck" data-id="'+d[0]+'">'+d[1]+'</button>';});
  h+='</div><div class="row"><select data-act="filter" id="filt">';
  var opts=S.deck==='elem'?[['all','All 46 elements'],['M','Metals (M)'],['TM','Transition metals (TM)'],['SM','Semimetals (SM)'],['NM','Nonmetals (NM)']]:[['all','All sections']].concat(D.sections.map(function(s){return [s.id,s.num+'. '+s.title];}));
  opts.forEach(function(o){h+='<option value="'+o[0]+'"'+(S.filter===o[0]?' selected':'')+'>'+o[1]+'</option>';});
  h+='</select><button class="chip" data-act="mode">'+(S.deck==='vocab'?(S.mode==='a'?'Term first':'Definition first'):S.deck==='diag'?(S.mode==='a'?'Name first':'Picture first'):(S.mode==='a'?'Name first':'Symbol first'))+' ⇄</button>';
  h+='<button class="chip" data-act="shuffle">Shuffle</button><label class="chip"><input type="checkbox" data-act="hideknown"'+(S.hideKnown?' checked':'')+'> hide known</label></div>';
  h+='<p class="note">Known: '+kn+' / '+all+' in this deck selection</p>';
  if(!cards.length){h+='<div class="info">No cards to show here. Change the filter or uncheck "hide known".</div>';app.innerHTML=h;return;}
  if(S.idx>=cards.length)S.idx=0;
  var c=cards[S.order[S.idx]];
  var front=S.mode==='a'?c.f:c.f2,back=S.mode==='a'?c.b:c.b2;
  h+='<div class="stage"><div class="card'+(S.flip?' back':'')+'" data-act="flip" role="button" tabindex="0">'+(S.flip?back:front)+'</div></div>';
  h+='<div class="row" style="justify-content:center"><button class="btn alt" data-act="prev">← Prev</button><span>'+(S.idx+1)+' / '+cards.length+'</span><button class="btn alt" data-act="next">Next →</button></div>';
  h+='<div class="row" style="justify-content:center"><button class="btn'+(KNOWN[c.id]?' alt':'')+'" data-act="known" data-id="'+c.id.replace(/"/g,'&quot;')+'">'+(KNOWN[c.id]?'✓ Marked known (tap to undo)':'I know this one')+'</button></div>';
  app.innerHTML=h;S._cards=cards;
}

/* ---------- PERIODIC TABLE ---------- */
var COLORS_T={metal:'#ffe08a',nonmetal:'#ff9fb4',metalloid:'#b9a2ff'};
var COLORS_F={alkali:'#ff8a65',alkaline:'#ffb74d',transition:'#fff176',inner:'#aed581',metal:'#90caf9',metalloid:'#b39ddb',nonmetal:'#80cbc4',halogen:'#f48fb1',noble:'#ce93d8'};
var NAMES_F={alkali:'Alkali metals (1A)',alkaline:'Alkaline earth metals (2A)',transition:'Transition metals (B groups)',inner:'Inner transition metals',metal:'Other metals',metalloid:'Metalloids',nonmetal:'Other nonmetals (incl. H)',halogen:'Halogens (7A)',noble:'Noble gases (8A)'};
function baseType(c){return (c==='metalloid')?'metalloid':(c==='nonmetal'||c==='halogen'||c==='noble')?'nonmetal':'metal';}
var GLAB={1:'1A',2:'2A',3:'3B',4:'4B',5:'5B',6:'6B',7:'7B',8:'8B',9:'8B',10:'8B',11:'1B',12:'2B',13:'3A',14:'4A',15:'5A',16:'6A',17:'7A',18:'8A'};
var CLASSSET={};
function renderPT(){
  D.elements.forEach(function(e){CLASSSET[e.s]=e;});
  var h='<h2>Periodic table geography</h2><div class="row">';
  [['type','Metals / nonmetals / metalloids'],['family','Families']].forEach(function(v){h+='<button class="chip'+(S.ptview===v[0]?' on':'')+'" data-act="ptview" data-id="'+v[0]+'">'+v[1]+'</button>';});
  h+='<label class="chip"><input type="checkbox" data-act="ptonly"'+(S.ptonly?' checked':'')+'> highlight only the 46 class elements</label></div>';
  h+='<div class="legend">';
  if(S.ptview==='type'){['metal','nonmetal','metalloid'].forEach(function(k){h+='<span><i style="background:'+COLORS_T[k]+'"></i>'+(k==='metal'?'Metals':k==='nonmetal'?'Nonmetals':'Metalloids')+'</span>';});}
  else{Object.keys(NAMES_F).forEach(function(k){h+='<span><i style="background:'+COLORS_F[k]+'"></i>'+NAMES_F[k]+'</span>';});}
  h+='</div><div class="pt">';
  var grid={};D.pt.forEach(function(e){grid[e.p+','+e.g]=e;});
  for(var p=1;p<=9;p++){
    if(p===8){for(var g0=1;g0<=18;g0++)h+='<div class="cell gap"></div>';}
    for(var g=1;g<=18;g++){
      var e=grid[p+','+g];
      if(!e){
        if((p===6||p===7)&&g===3){h+='<div class="cell ph"><small>'+(p===6?'57–71':'89–103')+'</small></div>';}
        else h+='<div class="cell gap"></div>';
        continue;
      }
      var col=S.ptview==='type'?COLORS_T[baseType(e.c)]:COLORS_F[e.c];
      var dim=S.ptonly&&!CLASSSET[e.sym];
      h+='<button class="cell'+(dim?' dim':'')+(S.ptsel===e.z?' sel':'')+'" style="background:'+col+'" data-act="cell" data-z="'+e.z+'"><span>'+e.sym+'</span><small>'+e.z+'</small></button>';
    }
  }
  h+='</div><div class="info" id="ptinfo">'+ptInfo()+'</div>';
  h+='<h3 style="margin-top:18px">Find it!</h3>'+gameHTML();
  app.innerHTML=h;
}
function ptInfo(){
  if(S.ptsel===null)return 'Tap an element to see its name, type and location. Groups are the columns (18); periods are the rows (7).';
  var e=D.pt[S.ptsel-1];var ce=CLASSSET[e.sym];
  var loc=e.g?('Group '+e.g+' (US label '+GLAB[e.g]+'), Period '+e.p):'Inner transition metals (two rows below the table)';
  if(!e.g||e.p>7)loc='Inner transition metals (two rows below the main table)';
  return '<b>'+e.name+' ('+e.sym+')</b> · atomic number '+e.z+'<br>'+NAMES_F[e.c]+(baseType(e.c)==='metalloid'?'':' · '+(baseType(e.c)==='metal'?'metal':'nonmetal'))+'<br>'+loc+(ce?'<br><b>On your class list:</b> '+ce.tw:'');
}
var TARGETS=[['alkali','the alkali metals (Group 1A)'],['alkaline','the alkaline earth metals (Group 2A)'],['halogen','the halogens (Group 7A)'],['noble','the noble gases (Group 8A)'],['transition','the transition metals (B groups)'],['metalloid','the metalloids (staircase)']];
function gameHTML(){
  if(!S.game)return '<p class="note">Practice locating the families: you will be asked to tap one element in a family.</p><button class="btn" data-act="gamestart">Start</button>';
  var t=TARGETS[S.game.t];
  return '<div class="info"><b>Tap any element in '+t[1]+'.</b><div id="gres" class="note">'+(S.game.msg||'')+'</div></div><div class="row"><span>Score: '+S.gscore.ok+' / '+S.gscore.n+'</span><button class="btn alt" data-act="gamenext">Skip / next</button><button class="btn alt" data-act="gamestop">Stop</button></div>';
}

/* ---------- TESTS ---------- */
function renderTests(){
  var h='<h2>Practice tests</h2>';
  if(S.test===null){
    h+='<p class="note">Three 20-question tests with no overlapping questions. Pick answers, then submit to see your score by section and explanations.</p>';
    D.tests.forEach(function(t,i){h+='<div class="lesson"><h3>Practice test '+(i+1)+'</h3><p>20 questions · '+(BEST[i]!==undefined?'Best score: '+BEST[i]+' / 20':'Not taken yet')+'</p><button class="btn" data-act="starttest" data-id="'+i+'">'+(BEST[i]!==undefined?'Retake':'Start')+'</button></div>';});
    app.innerHTML=h;return;
  }
  var t=D.tests[S.test];
  h+='<h3>Practice test '+(S.test+1)+'</h3>';
  t.forEach(function(q,i){h+=qHTML(q,'t'+S.test+':'+i,{test:true,num:i+1});});
  if(!S.tdone){var n=Object.keys(S.tsel).length;h+='<div class="row"><button class="btn" data-act="submit">Submit ('+n+' / 20 answered)</button><button class="btn alt" data-act="exittest">Back</button></div>';}
  else{
    var ok=0,sec={};t.forEach(function(q,i){var id='t'+S.test+':'+i;sec[q.sec]=sec[q.sec]||{ok:0,n:0};sec[q.sec].n++;if(S.tsel[id]===q.a){ok++;sec[q.sec].ok++;}});
    var r='<div class="lesson"><h3>Your score: '+ok+' / 20 ('+Math.round(ok*5)+'%)</h3><div class="resbar"><i style="width:'+(ok*5)+'%"></i></div>';
    D.sections.forEach(function(s){if(sec[s.id]){r+='<div class="row"><span>'+s.num+'. '+s.title+': <b>'+sec[s.id].ok+' / '+sec[s.id].n+'</b></span>'+(sec[s.id].ok<sec[s.id].n?'<button class="btn alt" data-act="gosec" data-id="'+s.id+'">Review this section</button>':'<span>✓</span>')+'</div>';}});
    r+='<div class="row"><button class="btn" data-act="starttest" data-id="'+S.test+'">Retake</button><button class="btn alt" data-act="exittest">All tests</button></div></div>';
    h=h.replace('<h3>Practice test '+(S.test+1)+'</h3>','<h3>Practice test '+(S.test+1)+'</h3>'+r);
  }
  app.innerHTML=h;
}

/* ---------- routing ---------- */
function render(){
  var tabs=[['learn','Learn'],['review','Review packet'],['cards','Flashcards'],['pt','Periodic table'],['tests','Practice tests']];
  document.getElementById('nav').innerHTML=tabs.map(function(t){return '<button data-act="tab" data-id="'+t[0]+'" class="'+(S.tab===t[0]?'on':'')+'">'+t[1]+'</button>';}).join('');
  if(S.tab==='learn')renderLearn();else if(S.tab==='review')renderReview();else if(S.tab==='cards')renderCards();else if(S.tab==='pt')renderPT();else renderTests();
}
function toTop(){window.scrollTo(0,0);}

document.addEventListener('click',function(ev){
  var t=ev.target.closest('[data-act]');if(!t)return;
  var act=t.getAttribute('data-act');
  if(act==='filter'||act==='hideknown'||act==='ptonly')return; // handled by change
  var id=t.getAttribute('data-id');
  switch(act){
    case 'tab':S.tab=id;if(id==='tests'){S.test=null;S.tdone=false;}render();toTop();break;
    case 'sec':S.sec=id;render();toTop();break;
    case 'gosec':S.tab='learn';S.sec=id;render();toTop();break;
    case 'ans':{var qid=t.getAttribute('data-qid');var i=parseInt(t.getAttribute('data-i'),10);if(ANS[qid]!==undefined)break;ANS[qid]=i;save();
      var q=QMAP[qid];var box=t.closest('.q');var btns=box.querySelectorAll('.opt');
      for(var k=0;k<btns.length;k++){btns[k].disabled=true;if(k===q.a)btns[k].classList.add('right');else if(k===i)btns[k].classList.add('wrong');}
      var w=box.querySelector('.why');w.innerHTML=(i===q.a?'<b>Correct.</b> ':'<b>Not quite.</b> ')+q.w;w.classList.add('show');
      var sc=document.getElementById('score');if(sc&&qid.indexOf('q:')===0)sc.textContent=quizScore(secById(S.sec));break;}
    case 'resetquiz':{var s=secById(id);s.quiz.forEach(function(q,i){delete ANS['q:'+s.id+':'+i];});save();render();break;}
    case 'deck':S.deck=id;S.filter='all';S.idx=0;S.flip=false;S.order=null;S.mode='a';render();break;
    case 'mode':S.mode=S.mode==='a'?'b':'a';S.flip=false;render();break;
    case 'shuffle':S.order=null;var cs=getCards();var o=shuffle(cs.map(function(c,i){return i;}));S.order=o;S.order._k=S.deck+S.filter+S.hideKnown;S.idx=0;S.flip=false;renderCards();break;
    case 'flip':S.flip=!S.flip;renderCards();break;
    case 'next':S.idx=(S.idx+1)%S._cards.length;S.flip=false;renderCards();break;
    case 'prev':S.idx=(S.idx-1+S._cards.length)%S._cards.length;S.flip=false;renderCards();break;
    case 'known':{var cid=t.getAttribute('data-id');if(KNOWN[cid])delete KNOWN[cid];else KNOWN[cid]=1;save();renderCards();break;}
    case 'ptview':S.ptview=id;renderPT();break;
    case 'cell':{var z=parseInt(t.getAttribute('data-z'),10);
      if(S.game){var e=D.pt[z-1];var tg=TARGETS[S.game.t][0];var good=(e.c===tg);
        S.gscore.n++;if(good){S.gscore.ok++;S.game.msg='✓ Correct! '+e.name+' ('+e.sym+') is in that family.';S.game.t=Math.floor(Math.random()*TARGETS.length);}
        else S.game.msg='✗ '+e.name+' ('+e.sym+') is a '+NAMES_F[e.c]+'. Try again.';
        S.ptsel=z;renderPT();}
      else{S.ptsel=z;renderPT();}
      break;}
    case 'gamestart':S.game={t:Math.floor(Math.random()*TARGETS.length),msg:''};S.gscore={ok:0,n:0};renderPT();break;
    case 'gamenext':S.game.t=Math.floor(Math.random()*TARGETS.length);S.game.msg='';renderPT();break;
    case 'gamestop':S.game=null;renderPT();break;
    case 'starttest':S.test=parseInt(id,10);S.tsel={};S.tdone=false;renderTests();toTop();break;
    case 'exittest':S.test=null;S.tdone=false;renderTests();toTop();break;
    case 'tsel':{if(S.tdone)break;var tq=t.getAttribute('data-qid');S.tsel[tq]=parseInt(t.getAttribute('data-i'),10);
      var bx=t.closest('.q').querySelectorAll('.opt');for(var m=0;m<bx.length;m++)bx[m].classList.toggle('sel',m===S.tsel[tq]);
      var sb=document.querySelector('[data-act="submit"]');if(sb)sb.textContent='Submit ('+Object.keys(S.tsel).length+' / 20 answered)';break;}
    case 'submit':{var tt=D.tests[S.test];var okc=0;tt.forEach(function(q,i){if(S.tsel['t'+S.test+':'+i]===q.a)okc++;});
      S.tdone=true;if(BEST[S.test]===undefined||okc>BEST[S.test])BEST[S.test]=okc;save();renderTests();toTop();break;}
  }
});
document.addEventListener('change',function(ev){
  var t=ev.target;var act=t.getAttribute&&t.getAttribute('data-act');
  if(act==='filter'){S.filter=t.value;S.idx=0;S.flip=false;S.order=null;renderCards();}
  else if(act==='hideknown'){S.hideKnown=t.checked;S.idx=0;S.flip=false;S.order=null;renderCards();}
  else if(act==='ptonly'){S.ptonly=t.checked;renderPT();}
});
document.addEventListener('keydown',function(ev){
  if(S.tab==='cards'&&S._cards&&S._cards.length&&ev.target.tagName!=='SELECT'){
    if(ev.key==='ArrowRight'){S.idx=(S.idx+1)%S._cards.length;S.flip=false;renderCards();}
    else if(ev.key==='ArrowLeft'){S.idx=(S.idx-1+S._cards.length)%S._cards.length;S.flip=false;renderCards();}
    else if(ev.key===' '&&ev.target.tagName!=='BUTTON'&&ev.target.tagName!=='INPUT'){ev.preventDefault();S.flip=!S.flip;renderCards();}
  }
});
render();
})();
</script>
</body>
