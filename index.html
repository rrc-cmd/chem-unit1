<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chemistry Unit 1 Study Guide</title>
<style>
:root{--bg:#0e1320;--panel:#172036;--panel2:#1d2845;--line:#2c3a5e;--text:#e9eef9;--mute:#9fb0d0;--good:#2ecc71;--bad:#ff5d6c;--accent:#4aa3ff;--warn:#ffd166}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;line-height:1.55;font-size:16px}
header.top{padding:18px 16px 8px;max-width:1000px;margin:0 auto}
header.top h1{margin:0 0 2px;font-size:1.5rem}
header.top p{margin:0;color:var(--mute);font-size:.92rem}
nav.main{position:sticky;top:0;z-index:20;background:rgba(14,19,32,.96);backdrop-filter:blur(6px);border-bottom:1px solid var(--line)}
nav.main .in{max-width:1000px;margin:0 auto;display:flex;gap:6px;padding:8px 12px;overflow-x:auto}
nav.main button{flex:0 0 auto;background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:999px;padding:8px 14px;font-size:.92rem;cursor:pointer;white-space:nowrap}
nav.main button.on{background:var(--accent);color:#06101f;border-color:var(--accent);font-weight:700}
main{max-width:1000px;margin:0 auto;padding:14px 16px 80px}
h2{margin:.2em 0 .3em;font-size:1.35rem}h3{margin:.1em 0 .4em;font-size:1.15rem}h4{margin:1em 0 .3em;font-size:1rem;color:var(--mute)}
.pills{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 14px}
.pill{border:2px solid var(--c);color:var(--text);background:transparent;border-radius:12px;padding:8px 12px;cursor:pointer;font-size:.9rem;text-align:left;max-width:100%}
.pill.on{background:var(--c);color:#06101f;font-weight:700}
.sec-head{border-left:6px solid var(--c);padding:6px 12px;margin-bottom:12px;background:var(--panel);border-radius:0 10px 10px 0}
.tag{font-size:.8rem;color:var(--mute)}
.lesson{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin:14px 0}
.lbody p,.lbody li{margin:.4em 0}
.box{background:var(--panel2);border:1px solid var(--line);border-left:5px solid var(--accent);border-radius:10px;padding:10px 12px;margin:10px 0}
.note{color:var(--mute);font-size:.9rem}
.tw{overflow-x:auto;margin:10px 0}
table.tbl{border-collapse:collapse;width:100%;min-width:420px;font-size:.92rem}
table.tbl th,table.tbl td{border:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
table.tbl th{background:var(--panel2)}
figure.fig{display:inline-block;vertical-align:top;width:min(100%,290px);margin:8px 6px 8px 0;background:#fff;color:#111;border-radius:10px;padding:6px}
figure.fig.wide{width:min(100%,480px)}
figure.fig figcaption{font-size:.8rem;text-align:center;color:#333;padding-top:2px}
.qfig{background:#fff;border-radius:10px;padding:6px;margin:8px 0;max-width:520px}
.qfig svg,.qfig img{display:block;width:100%;height:auto;max-width:480px;margin:0 auto}
.checks{border-top:1px dashed var(--line);margin-top:12px;padding-top:6px}
.q{margin:12px 0;padding:10px 12px;background:var(--panel2);border-radius:10px;border:1px solid var(--line)}
.qt{font-weight:600;margin-bottom:6px}
.opts{display:grid;gap:6px}
.opt{width:100%;text-align:left;background:var(--panel);color:var(--text);border:2px solid var(--line);border-radius:10px;padding:9px 11px;font-size:.95rem;cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt.sel{border-color:var(--accent);background:#1d3a66}
.opt.right{border-color:var(--good);background:#12351f}
.opt.wrong{border-color:var(--bad);background:#3a1620}
.opt:disabled{cursor:default;color:var(--text);opacity:1}
.why{display:none;margin-top:8px;font-size:.92rem;color:#dfe8fb}.why.show{display:block}
.btn{background:var(--accent);color:#06101f;border:0;border-radius:10px;padding:9px 14px;font-weight:700;cursor:pointer;font-size:.95rem}
.btn.alt{background:var(--panel2);color:var(--text);border:1px solid var(--line);font-weight:600}
.btn:disabled{opacity:.4;cursor:default}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:8px 0}
.score{margin-top:8px;font-weight:700}
details{background:var(--panel);border:1px solid var(--line);border-radius:12px;margin:10px 0;padding:8px 12px}
details summary{cursor:pointer;font-weight:700}
details[open] summary{margin-bottom:6px}
.chk{margin:.4em 0 .4em 1.2em;padding:0;list-style:'☐  '}
.termgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:8px}
.termgrid details{margin:0}
.stage{display:flex;justify-content:center}
.card{width:100%;max-width:640px;min-height:260px;background:var(--panel);border:2px solid var(--line);border-radius:18px;padding:18px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;cursor:pointer;user-select:none}
.card.back{background:#1b2c4d;border-color:var(--accent)}
.card .big{font-size:1.8rem;font-weight:800}
.card .sub{margin-top:8px;color:var(--mute);font-size:.85rem}
.card ul{text-align:left;margin:.5em 0 0;padding-left:1.2em;font-size:.95rem}
.card .qfig{max-width:420px;width:100%}
.card .def{font-size:1.1rem}
select,.chip{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:.92rem}
.chip{cursor:pointer}.chip.on{background:var(--accent);color:#06101f;font-weight:700;border-color:var(--accent)}
.pt{display:grid;grid-template-columns:repeat(18,minmax(0,1fr));gap:2px;margin:10px 0}
.cell{aspect-ratio:1/1.05;border-radius:4px;border:1px solid rgba(0,0,0,.35);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:clamp(.5rem,1.6vw,.85rem);font-weight:700;cursor:pointer;color:#0b1220;padding:0;line-height:1}
.cell small{font-size:.55em;font-weight:500;opacity:.75}
.cell.dim{opacity:.22}.cell.sel{outline:3px solid #fff}
.cell.ph{background:transparent;border:1px dashed var(--line);cursor:default;color:var(--mute);font-weight:500}
.cell.gap{visibility:hidden}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;margin:6px 0;font-size:.82rem}
.legend span i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.info{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-height:60px}
.resbar{height:12px;background:var(--panel2);border-radius:99px;overflow:hidden;margin:4px 0 8px}.resbar i{display:block;height:100%;background:var(--good)}
.flow{margin:12px 0;font-size:.85rem}
.flow .fr{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.flow .fb{background:#fff;color:#111;border:2px solid #333;border-radius:8px;padding:6px 8px;flex:1 1 150px;max-width:300px;text-align:center}
.flow .fb b{display:block;font-size:.95rem;border-bottom:1px solid #999;margin-bottom:3px}
.flow .ar{text-align:center;color:var(--mute);line-height:1.1;margin:2px 0}
.flow .cols{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.flow .col{display:flex;flex-direction:column;align-items:stretch}
.flow .fb.m{background:#fff6d6}.flow .fb.p{background:#dff6e6}.flow .fb.t{background:#d9e8ff}
@media (max-width:620px){.flow .cols{grid-template-columns:1fr}}
.foot{margin-top:30px;color:var(--mute);font-size:.82rem;text-align:center}
.elgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:4px 14px;margin:8px 0}
.elgrid div{display:flex;justify-content:space-between;border-bottom:1px solid var(--line);padding:3px 0;font-size:.9rem}
.elgrid b{min-width:2.2em}
</style>
</head>

<script type="application/json" id="gdata">{"sections":[{"id":"s1","num":1,"color":"#4aa3ff","title":"The Particle Model: Solids, Liquids & Gases","tag":"Review packet #1 (solid, liquid, gas) and #5 (syringe)","intro":"How we explain what we observe in terms of particles you cannot see.","lessons":[{"id":"l1_1","title":"Evidence vs. particles (CER)","html":"\n<p><b>Evidence<\/b> = data, measurements and observations of things you can <b>see, smell or feel<\/b>. <b>Particles are NOT evidence<\/b>, because you can't see them. You can make <b>claims<\/b> about particles, but you must support them with evidence.<\/p>\n<div class=\"box\"><b>CER<\/b><ul><li><b>Claim<\/b> – your answer to the question.<\/li><li><b>Evidence<\/b> – observable data from the demo (numbers, measurements, what you saw or smelled).<\/li><li><b>Reasoning<\/b> – the \"because\": use class vocabulary and particle ideas to explain how the evidence supports the claim.<\/li><\/ul><\/div>\n<p>Expect to be asked <i>\"What makes you say so?\"<\/i> or <i>\"Justify your choice.\"<\/i> Always be ready to define every term you use. Example: \"It is a mixture <b>because<\/b> there are 2 different elements present in the substance.\"<\/p>\n","checks":[{"q":"Which statement is EVIDENCE (not a claim) from the syringe demo?","o":["Particles in air collide elastically.","The air in the syringe went from 39 mL to 15 mL when the plunger was pushed.","There is empty space between particles.","Gas particles are far apart."],"a":1,"w":"Evidence is something you can observe or measure. The other three are claims about particles, which you cannot see."},{"q":"In a CER, what is the job of the REASONING?","o":["To list the data you collected","To state the answer","To draw the apparatus","To explain how the evidence supports the claim using vocabulary and particle ideas"],"a":3,"w":"Claim = answer, Evidence = data, Reasoning = the explanation linking them."}]},{"id":"l1_2","title":"Kinetic Molecular Theory (KMT)","html":"\n<p><b>Kinetic Molecular Theory<\/b> describes the movement of particles. For <b>gases<\/b>:<\/p>\n<ul>\n<li>Particles are in <b>constant, random motion<\/b>.<\/li>\n<li>Particles travel in <b>straight lines<\/b> until they collide.<\/li>\n<li>When particles collide they <b>change direction<\/b> (think <b>bumper cars<\/b>).<\/li>\n<li>Gas particles move at <b>hundreds of miles per hour<\/b>.<\/li>\n<\/ul>\n<div class=\"box\"><b>Elastic collision<\/b> = energy is transferred from the higher-energy particle to the lower-energy particle, but the <b>total energy is conserved<\/b> (none is lost).<\/div>\n<p class=\"note\">Class note: \"It's not about how a particle moves through space, it's about the way they bounce off of each other.\"<\/p>\n","checks":[{"q":"What happens when two gas particles collide, according to KMT?","o":["They stop moving","They disappear","They stick together permanently","They change direction, like bumper cars"],"a":3,"w":"Particles travel in straight lines until a collision changes their direction."},{"q":"In an ELASTIC collision, the total energy of the particles...","o":["is destroyed","is conserved (stays the same overall)","doubles","is turned into new particles"],"a":1,"w":"Energy can pass from one particle to another, but the total is conserved."}]},{"id":"l1_3","title":"Solids, liquids and gases","html":"\n<div class=\"tw\"><table class=\"tbl\"><tr><th><\/th><th>Solid<\/th><th>Liquid<\/th><th>Gas<\/th><\/tr>\n<tr><td><b>Particle arrangement<\/b><\/td><td>Close together, organized in a fixed <b>lattice<\/b><\/td><td>Close together, <b>no fixed arrangement<\/b><\/td><td><b>None<\/b>; widely separated<\/td><\/tr>\n<tr><td><b>Particle motion<\/b><\/td><td>Always moving (vibrating) but <b>can't move past each other<\/b><\/td><td>Faster than solid; <b>slip past one another<\/b>, constantly changing direction<\/td><td><b>Fastest<\/b>; move freely and independently<\/td><\/tr>\n<tr><td><b>Space between<\/b><\/td><td>Very little<\/td><td>A little more than solid, still close<\/td><td>Very far apart<\/td><\/tr>\n<tr><td><b>Forces of attraction<\/b><\/td><td><b>Very strong<\/b> – lock particles in place<\/td><td>Weaker – <b>temporary<\/b> attractions constantly made and broken<\/td><td><b>None<\/b> (essentially no attraction)<\/td><\/tr>\n<tr><td><b>Shape / volume<\/b><\/td><td>Holds its shape<\/td><td>Takes the <b>shape of its container<\/b>; volume stays the same<\/td><td>Fills the <b>whole container<\/b><\/td><\/tr><\/table><\/div>\n<figure class=\"fig\"><svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 220 162\" role=\"img\" style=\"width:100%;max-width:330px;height:auto;background:transparent\"><g transform=\"translate(0,0)\"><rect x=\"0.8\" y=\"0.8\" width=\"218.4\" height=\"138.4\" fill=\"#fff\" stroke=\"#111\" stroke-width=\"2\"/><circle cx=\"41.8\" cy=\"119.0\" r=\"9\" fill=\"#111111\" stroke=\"#111\" stroke-width=\"1.6\"/><circle cx=\"61.2\" cy=\"119.0\" r=\"9\" fill=\"#111111\" stroke=\"#111\" stroke-width=\"1.6\"/><circle cx=\"80.8\" cy=\"119.0\" r=\"9\" fill=\"#111111\" stroke=\"#111\" stroke-width=\"1.6\"/><circle cx=\"100.2\" cy=\"119.0\" r=\"9\" fill=\"#111111\" stroke=\"#111\" stroke-width=\"1.6\"/><circle cx=\"119.8\" cy=\"119.0\" r=\"9\" fill=\"#111111\" stroke=\"#111\" stroke-width=\"1.6\"/><circle cx=\"139.2\" cy=\"119.0\" r=\"9\" fill=\"#111111\" stroke=\"#111\" stroke-width=\"1.6\"/><circle cx=\"158.8\" cy=\"119.0\" r=\"9\" fill=\"#111111\" stroke=\"#111\" stroke-width=\"1.6\"/><circle cx=\"178.2\" cy=\"119.0\" r=\"9\" fill=\"#111111\" stroke=\"#111\" stroke-width=\"1.6\"/><circle cx=\"41.8\" cy=\"99.5\" r=\"9\" fill=\"#111111\" stroke=\"#111\" stroke-width=\"1.6\"/><circle cx=\"61.2\" cy=\"99.5\" r=\"9\" fill=\"#111111\" stroke=\"#111\" stroke-width=\"1.6\"/><circle cx=\"80.8\" cy=\"99.5\" r=\"9\" fill=\"#111111\" stroke=\"#111\" stroke-width=\"1.6\"/><circle cx=\"100.2\" cy=\"99.5\" r=\"9\" fill=\"#111111\" stroke=\"#111\" stroke-width=\"1.6\"/><circle cx=\"119.8\" cy=\"99.5\" r 9\" cy=\"101.3\" r=\"9\" fill=\"#111111\" stroke=\"#111\" stroke-width=\"1.6\"/><circle cx=\"133.1\" cy=\"93.7\" r=\"9\" fill=\"#111111\" stroke=\"#111\" stroke-width=\"1.6\"/><circle cx=\"179.2\" cy=\"27.8\" r=\"9\" fill=\"#111111\" stroke=\"#111\" stroke-width=\"1.6\"/><line x1=\"56.8\" y1=\"19.8\" x2=\"48.3\" y2=\"4.0\" stroke=\"#c0392b\" stroke-width=\"1.5\"/><polygon points=\"48.3,4.0 52.1,6.3 48.1,8.5\" fill=\"#c0392b\"/><line x1=\"81.1\" y1=\"112.2\" x2=\"63.1\" y2=\"111.5\" stroke=\"#c0392b\" stroke-width=\"1.5\"/><polygon points=\"63.1,111.5 67.1,109.4 66.9,113.9\" fill=\"#c0392b\"/><line x1=\"163.1\" y1=\"51.5\" x2=\"171.0\" y2=\"67.7\" stroke=\"#c0392b\" stroke-width=\"1.5\"/><polygon points=\"171.0,67.7 167.2,65.2 171.3,63.2\" fill=\"#c0392b\"/><line x1=\"27.5\" y1=\"42.7\" x2=\"9.7\" y2=\"45.7\" stroke=\"#c0392b\" stroke-width=\"1.5\"/><polygon points=\"9.7,45.7 13.2,42.8 13.9,47.2\" fill=\"#c0392b\"/><line x1=\"179.2\" y1=\"107.1\" x2=\"194.4\" y2=\"116.7\" stroke=\"#c0392b\" stroke-width=\"1.5\"/><polygon points=\"194.4,116.7 189.9,116.5 192.3,112.7\" fill=\"#c0392b\"/><line x1=\"143.2\" y1=\"89.3\" x2=\"159.7\" y2=\"82.1\" stroke=\"#c0392b\" stroke-width=\"1.5\"/><polygon points=\"159.7,82.1 157.0,85.7 155.2,81.6\" fill=\"#c0392b\"/><line x1=\"186.5\" y1=\"19.6\" x2=\"198.4\" y2=\"6.2\" stroke=\"#c0392b\" stroke-width=\"1.5\"/><polygon points=\"198.4,6.2 197.5,10.6 194.1,7.6\" fill=\"#c0392b\"/><\/g><\/svg><figcaption>Gas (arrows = motion)<\/figcaption><\/figure>\n<div class=\"box\"><b>Drawing tips:<\/b> solids and liquids do <b>not<\/b> float in mid-air – draw them resting at the bottom of the container. Show <b>motion<\/b> with arrows. A liquid's volume never changes even though its depth can change. A liquid taking the shape of its container is evidence its particles can pass each other.<\/div>\n","checks":[{"q":"Which statement correctly describes the particles of a LIQUID?","o":["Far apart with no attraction","Not moving at all","Close together but able to slip past one another","Locked in a fixed lattice"],"a":2,"w":"Liquid particles are close together but not locked in place; they slip past each other."},{"q":"Which state of matter has particles with NO attractive forces between them and the greatest speed?","o":["Gas","Solid","Both liquid and solid","Liquid"],"a":0,"w":"Gas particles are independent, widely separated and move fastest."},{"q":"Why does a liquid take the shape of its container?","o":["Its particles can move past each other","Its particles are locked in a lattice","Its particles are far apart","Its particles have no mass"],"a":0,"w":"Because particles can slide past one another, the liquid flows to fit the container."},{"q":"A student draws a liquid as particles floating in the middle of the container. What should be fixed?","o":["The particles should be drawn close together at the bottom of the container","The particles should be drawn in a perfect lattice","The particles should be spread far apart","The particles should be removed"],"a":0,"w":"Liquids do not float in mid-air; they settle at the bottom with particles close together."}]},{"id":"l1_4","title":"The syringe demo: evidence for space between particles","html":"\n<div class=\"tw\"><table class=\"tbl\"><tr><th>Substance<\/th><th>Observation (evidence)<\/th><th>Claim about particles<\/th><\/tr>\n<tr><td><b>Air (gas)<\/b><\/td><td>39 mL of air <b>compressed to 15 mL<\/b> when the plunger was pushed and plugged. When the pressing stopped, it returned to <b>39 mL<\/b>.<\/td><td>There is a lot of <b>space between gas particles<\/b>, so they can be pushed closer together.<\/td><\/tr>\n<tr><td><b>Water (liquid)<\/b><\/td><td>30 mL of water stayed at <b>30 mL<\/b> – it did not compress.<\/td><td>There is very <b>little space between liquid particles<\/b>; they are already close.<\/td><\/tr><\/table><\/div>\n<figure class=\"fig wide\"><svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 324 152\" role=\"img\" style=\"width:100%;max-width:486px;height:auto;background:transparent\"><g transform=\"translate(0,0)\"><rect x=\"0.8\" y=\"0.8\" width=\"198.4\" height=\"128.4\" fill=\"#fff\" stroke=\"#111\" stroke-width=\"2\"/><circle cx=\"80.7\" cy=\"40.2\" r=\"9\" fill=\"#111111\" stroke=\"#111\" stroke-width=\"1.6\"/><circle cx=\"167.0\" cy=\"72.2\" r=\"9\" fill=\"#111111\" stroke=\"#111\" stroke-width=\"1.6\"/><circle cx=\"108.6\" cy=\"54.3\" r=\"9\" fill=\"#111111\" stroke=\"#111\" stroke-width=\"1.6\"/><circle cx=\"112.4\" cy=\"90.9\" r=\"9\" fill=\"#111111\" stroke=\"#111\" stroke-width=\"1.6\"/><circle cx=\"44.1\" cy=\"32.8\" r=\"9\" fill=\"#111111\" stroke=\"#111\" stroke-width=\"1.6\"/><circle cx=\"46.1\" cy=\"79.2\" r=\"9\" fill=\"#111111\" stroke=\"#111\" stroke-width=\"1.6\"/><line x1=\"91.0\" y1=\"44.2\" x2=\"104.0\" y2=\"49.4\" stroke=\"#c0392b\" stroke-width=\"1.5\"/><polygon points=\"104.0,49.4 99.5,50.0 101.2,45.8\" fill=\"#c0392b\"/><line x1=\"169.4\" y1=\"61.4\" x2=\"172.4\" y2=\"47.7\" stroke=\"#c0392b\" stroke-width=\"1.5\"/><polygon points=\"172.4,47.7 173.8,52.0 169.4,51.1\" fill=\"#c0392b\"/><line x1=\"119.4\" y1=\"56.6\" x2=\"133.1\" y2=\"59.4\" stroke=\"#c0392b\" stroke-width=\"1.5\"/><polygon points=\"133.1,59.4 128.8,60.8 129.7,56.4\" fill=\"#c0392b\"/><line x1=\"119.8\" y1=\"82.7\" x2=\"129.1\" y2=\"72.3\" stroke=\"#c0392b\" stroke-width=\"1.5\"/><polygon points=\"129.1,72.3 128.2,76.7 124.9,73.7\" fill=\"#c0392b\"/><line x1=\"50.1\" y1=\"23.5\" x2=\"57.7\" y2=\"11.8\" stroke=\"#c0392b\" stroke-width=\"1.5\"/><polygon points=\"57.7,11.8 57.4,16.3 53.7,13.8\" fill=\"#c0392b\"/><line x1=\"48.5\" y1=\"90.0\" x2=\"51.5\" y2=\"103.7\" stroke=\"#c0392b\" stroke-width=\"1.5\"/><polygon points=\"51.5,103.7 48.4,100.3 52.8,99.4\" fill=\"#c0392b\"/><rect x=\"190\" y=\"1\" width=\"9\" height=\"128\" fill=\"#7f8c8d\" stroke=\"#111\" stroke-width=\"1.5\"/><text x=\"100.0\" y=\"147\" text-anchor=\"middle\" font-family=\"Arial,sans-serif\" font-size=\"13\" font-weight=\"bold\" fill=\"#111\">Start (39 mL)<\/text><\/g><g transform=\"translate(224,0)\"><rect x=\"0.8\" y=\"0.8\" width=\"98.4\" height=\"128.4\" fill=\"#fff\" stroke=\"#111\" stroke-width=\"2\"/><circle cx=\"58.6\" cy=\"21.3\" r=\"9\" fill=\"#111111\" stroke=\"#111\" stroke-width=\"1.6\"/><circle cx=\"32.8\" cy=\"86.8\" r=\"9\" fill=\"#111111\" stroke=\"#111\" stroke-width=\"1.6\"/><circle cx=\"32.6\" cy=\"65.5\" r=\"9\" fill=\"#111111\" stroke=\"#111\" stroke-width=\"1.6\"/><circle cx=\"55.5\" cy=\"93.5\" r=\"9\" fill=\"#111111\" stroke=\"#111\" stroke-width=\"1.6\"/><circle cx=\"40.1\" cy=\"33.3\" r=\"9\" fill=\"#111111\" stroke=\"#111\" stroke-width=\"1.6\"/><circle cx=\"64.2\" cy=\"68.3\" r=\"9\" fill=\"#111111\" stroke=\"#111\" stroke-width=\"1.6\"/><line x1=\"50.7\" y1=\"28.9\" x2=\"44.2\" y2=\"35.1\" stroke=\"#c0392b\" stroke-width=\"1.5\"/><polygon points=\"44.2,35.1 45.5,30.8 48.6,34.1\" fill=\"#c0392b\"/><line x1=\"22.4\" y1=\"83.2\" x2=\"13.9\" y2=\"80.3\" stroke=\"#c0392b\" stroke-width=\"1.5\"/><polygon points=\"13.9,80.3 18.3,79.5 16.9,83.7\" fill=\"#c0392b\"/><line x1=\"37.8\" y1=\"55.8\" x2=\"42.1\" y2=\"47.9\" stroke=\"#c0392b\" stroke-width=\"1.5\"/><polygon points=\"42.1,47.9 42.2,52.4 38.3,50.3\" fill=\"#c0392b\"/><line x1=\"47.4\" y1=\"86.0\" x2=\"40.8\" y2=\"79.9\" stroke=\"#c0392b\" stroke-width=\"1.5\"/><polygon points=\"40.8,79.9 45.2,80.9 42.2,84.2\" fill=\"#c0392b\"/><line x1=\"47.2\" y1=\"24.9\" x2=\"53.0\" y2=\"18.0\" stroke=\"#c0392b\" stroke-width=\"1.5\"/><polygon points=\"53.0,18.0 52.2,22.5 48.8,19.6\" fill=\"#c0392b\"/><line x1=\"54.5\" y1=\"63.2\" x2=\"46.6\" y2=\"59.0\" stroke=\"#c0392b\" stroke-width=\"1.5\"/><polygon points=\"46.6,59.0 51.1,58.8 49.0,62.8\" fill=\"#c0392b\"/><rect x=\"90\" y=\"1\" width=\"9\" height=\"128\" fill=\"#7f8c8d\" stroke=\"#111\" stroke-width=\"1.5\"/><text x=\"50.0\" y=\"147\" text-anchor=\"middle\" font-family=\"Arial,sans-serif\" font-size=\"13\" font-weight=\"bold\" fill=\"#111\">Pushed (15 mL)<\/text><\/g><\/svg><figcaption>Gas particles in the syringe: same particles, less space<\/figcaption><\/figure>\n<p><b>Key point:<\/b> the volume went down <b>even though no air left the syringe<\/b>, so the particles themselves were pushed closer together. Solids can't be compressed either (their particles are locked close together), so they have little space between particles too.<\/p>\n<p class=\"note\">Drawing the gas CER diagram: use the same number of particles before and after (6 particles), show motion with arrows, and make the \"pushed\" box smaller.<\/p>\n","checks":[{"q":"What evidence from the syringe demo shows there is a lot of space between gas particles?","o":["The plunger got heavier","The air could be compressed from 39 mL to 15 mL","The water could be compressed","The air left the syringe"],"a":1,"w":"Compression of the gas (volume decreased without any air escaping) shows the particles were far apart."},{"q":"The 30 mL of water did not change volume when the plunger was pushed. Which claim does this support?","o":["Liquid particles have very little space between them","Liquid particles are far apart","Liquid particles are not moving","Water is not matter"],"a":0,"w":"No compression means the particles are already close together."}]}],"quiz":[{"q":"Which is the best example of EVIDENCE?","o":["The water volume stayed at 30 mL after pushing the plunger.","Particles attract each other.","Water particles are close together.","Liquids have strong forces."],"a":0,"w":"Evidence is data you can observe; the others are claims about particles."},{"q":"Which state has particles that vibrate in fixed positions in a lattice?","o":["Liquid","All three","Gas","Solid"],"a":3,"w":"Solid particles are locked in a lattice by strong forces of attraction."},{"q":"In KMT, what causes a gas particle to change direction?","o":["Being heated by sunlight","A change in color","Gravity only","A collision with another particle"],"a":3,"w":"Collisions (bumper cars) change direction."},{"q":"Which statement about a liquid is TRUE?","o":["Its particles have no motion","It always fills the whole container","Its volume stays the same even if the depth changes","Its particles are in a lattice"],"a":2,"w":"Liquids keep a constant volume but take the shape of the container."},{"q":"Compared with gas particles, solid particles are ...","o":["farther apart and faster","much closer together with much stronger attractions","the same distance apart","unable to move at all"],"a":1,"w":"Solid particles are close together with very strong attractions (they still vibrate)."}]},{"id":"s2","num":2,"color":"#ff9f43","title":"Diffusion, Temperature & Energy","tag":"Review packet #1 (diffusion, temperature/KE, thermal expansion), #6 (pizza) and #7 (hot vs. cold)","intro":"How particles spread out, why temperature changes the speed, and what that does to matter.","lessons":[{"id":"l2_1","title":"Diffusion and the random walk","html":"\n<div class=\"box\"><b>Diffusion<\/b> = the gradual mixing of particles as they move from an area of <b>high concentration<\/b> to an area of <b>low concentration<\/b>. Concentration = number of particles per unit area.<\/div>\n<p><b>Perfume video observations:<\/b> students closest to the spray smelled it first; the left side smelled it before the right; and the particles <b>did not move in a straight line<\/b> from the spray to your nose.<\/p>\n<p><b>Why so slow?<\/b> Gas particles move hundreds of miles an hour, but they <b>collide constantly<\/b>. Each <b>elastic collision<\/b> sends a particle in a new direction, so the path is a zig-zag <b>random walk<\/b> (random motion in no particular direction). The particles end up spreading out gradually, with the net movement from high to low concentration.<\/p>\n<figure class=\"fig wide\"><svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 396 142\" role=\"img\" style=\"width:100%;max-width:594px;height:auto;background:transparent\"><g transform=\"translate(0,0)\"><rect x=\"0.8\" y=\"0.8\" width=\"188.4\" height=\"118.4\" fill=\"#fff\" stroke=\"#111\" stroke-width=\"2\"/><circle cx=\"26.7\" cy=\"32.3\" r=\"9\" fill=\"#111111\" stroke=\"#111\" stroke-width=\"1.6\"/><circle cx=\"28.0\" cy=\"95.0\" r=\"9\" fill=\"#111111\" stroke=\"#111\" stroke-width=\"1.6\"/><circle cx=\"32.9\" cy=\"63.9\" r=\"9\" fill=\"#111111\" stroke=\"#111\" stroke-width=\"1.6\"/><circle cx=\"15.1\" cy=\"75.7\" r=\"9\" fill=\"#111111\" stroke=\"#111\" stroke-width=\"1.6\"/><circle cx=\"14.5\" cy=\"52.9\" r=\"9\" fill=\"#111111\" stroke=\"#111\" stroke-width=\"1.6\"/><circle cx=\"107.9\" cy=\"31.6\" r=\"9\" fill=\"#ffffff\" stroke=\"#111\" stroke-width=\"1.6\"/><circle cx=\"133.7\" cy=\"89.3\" r=\"9\" fill=\"#ffffff\" stroke=\"#111\" stroke-width=\"1.6\"/><circle cx=\"146.7\" cy=\"45.0\" r=\"9\" fill=\"#ffffff\" stroke=\"#111\" stroke-width=\"1.6\"/><circle cx=\"100.5\" cy=\"94.3\" r=\"9\" fill=\"#ffffff\" stroke=\"#111\" stroke-width=\"1.6\"/><circle cx=\"161.6\" cy=\"65.2\" r=\"9\" fill=\"#ffffff\" stroke=\"#111\" stroke-width=\"1.6\"/><circle cx=\"165.3\" cy=\"23.5\" r=\"9\" fill=\"#ffffff\" stroke=\"#111\" stroke-width=\"1.6\"/><circle cx=\"71.9\" cy=\"72.3\" r=\"9\" fill=\"#ffffff\" stroke=\"#111\" stroke-width=\"1.6\"/><text x=\"95.0\" y=\"137\" text-anchor=\"middle\" font-family=\"Arial,sans-serif\" font-size=\"13\" font-weight=\"bold\" fill=\"#111\">Start<\/text><\/g><g transform=\"translate(206,0)\"><rect x=\"0.8\" y=\"0.8\" width=\"188.4\" height=\"118.4\" fill=\"#fff\" stroke=\"#111\" stroke-width=\"2\"/><circle cx=\"167.7\" cy=\"23.5\" r=\"9\" fill=\"#111111\" stroke=\"#111\" stroke-width=\"1.6\"/><circle cx=\"92.5\" cy=\"96.2\" r=\"9\" fill=\"#111111\" stroke=\"#111\" stroke-width=\"1.6\"/><circle cx=\"170.2\" cy=\"52.9\" r=\"9\" fill=\"#111111\" stroke=\"#111\" stroke-width=\"1.6\"/><circle cx=\"71.6\" cy=\"70.7\" r=\"9\" fill=\"#111111\" stroke=\"#111\" stroke-width=\"1.6\"/><circle cx=\"77.9\" cy=\"19.9\" r=\"9\" fill=\"#111111\" stroke=\"#111\" stroke-width=\"1.6\"/><circle cx=\"44.9\" cy=\"37.9\" r=\"9\" fill=\"#ffffff\" stroke=\"#111\" stroke-width=\"1.6\"/><circle cx=\"137.3\" cy=\"53.1\" r=\"9\" fill=\"#ffffff\" stroke=\"#111\" stroke-width=\"1.6\"/><circle cx=\"155.6\" cy=\"92.4\" r=\"9\" fill=\"#ffffff\" stroke=\"#111\" stroke-width=\"1.6\"/><circle cx=\"106.5\" cy=\"74.0\" r=\"9\" fill=\"#ffffff\" stroke=\"#111\" stroke-width=\"1.6\"/><circle cx=\"101.6\" cy=\"30.7\" r=\"9\" fill=\"#ffffff\" stroke=\"#111\" stroke-width=\"1.6\"/><circle cx=\"23.3\" cy=\"19.4\" r=\"9\" fill=\"#ffffff\" stroke=\"#111\" stroke-width=\"1.6\"/><circle cx=\"129.1\" cy=\"93.0\" r=\"9\" fill=\"#ffffff\" stroke=\"#111\" stroke-width=\"1.6\"/><text x=\"95.0\" y=\"137\" text-anchor=\"middle\" font-family=\"Arial,sans-serif\" font-size=\"13\" font-weight=\"bold\" fill=\"#111\">Later<\/text><\/g><\/svg><figcaption>Perfume (black) spreading among air particles<\/figcaption><\/figure>\n<div class=\"box\"><b>Answering the \"pizza\" question (#6):<\/b> use the words <b>diffusion, random walk, elastic collisions<\/b>, and draw particle diagrams (concentrated near the pizza at first, spread out later).<\/div>\n","checks":[{"q":"After looking at the path of dye molecules in the Concord applet, how is their motion best described?","o":["Moving in clumps together","Moving randomly through collisions in no particular direction","Moving in a straight, directed line from high to low concentration","Staying close to other dye molecules"],"a":1,"w":"Each collision changes direction, so the path is random (a random walk)."},{"q":"Perfume particles move hundreds of miles per hour, yet it takes minutes to smell it across a room. Why?","o":["Only liquid particles can diffuse","They collide with air particles constantly, so their path zig-zags and net progress is slow","They are attracted to the spray bottle","They move very slowly"],"a":1,"w":"Constant collisions and direction changes slow the net spread (random walk)."},{"q":"Diffusion is the movement of particles from...","o":["high concentration to low concentration","low concentration to high concentration","solid to liquid","cold to hot"],"a":0,"w":"Net movement is from high to low concentration."}]},{"id":"l2_2","title":"What speeds diffusion up?","html":"\n<ul>\n<li><b>Higher temperature<\/b> – particles move faster and collide more frequently, so the perfume diffuses (mixes) more quickly when heated. A hotter room means the smell crosses the room faster.<\/li>\n<li><b>Higher concentration<\/b> – more particles to spread, so more particles move from the crowded area toward the empty area (Concord applet: doubling the perfume particles).<\/li>\n<\/ul>\n<p><b>Around a corner:<\/b> in an L-shaped room you would still smell the perfume, because particles move randomly and keep colliding, so some end up going around the corner.<\/p>\n","checks":[{"q":"Would perfume make it across a room faster if the room were hotter or colder?","o":["Colder, because particles move faster","Colder, because particles attract each other more","No difference","Hotter, because particles move faster and collide more often"],"a":3,"w":"Higher temperature means faster particles, so quicker diffusion."},{"q":"If you stand around the corner of an L-shaped room from a spilled perfume bottle, will you eventually smell it?","o":["Yes, because particles move randomly and collide, so some travel around the corner","No, because gas particles cannot turn","Only if the room is cold","No, because particles only move in straight lines forever"],"a":0,"w":"Random motion and collisions let particles spread into all parts of the room."}]},{"id":"l2_3","title":"Temperature and kinetic energy","html":"\n<div class=\"box\"><b>Temperature<\/b> measures the <b>average kinetic energy (KE)<\/b> of the particles. Kinetic energy = <b>½ m v²<\/b>. Indirectly, temperature measures the <b>speed<\/b> of the particles: higher temperature = faster particles.<\/div>\n<p><b>Food-dye demo (two flasks of water):<\/b><\/p>\n<div class=\"tw\"><table class=\"tbl\"><tr><th>Flask<\/th><th>Temperature<\/th><th>Observation<\/th><\/tr>\n<tr><td>Red (warm)<\/td><td>21 °C → <b>50 °C<\/b><\/td><td>Mixed <b>faster<\/b> and <b>better<\/b><\/td><\/tr>\n<tr><td>Blue (cold)<\/td><td><b>11 °C<\/b> (final)<\/td><td>Took ~15 minutes to diffuse and was <b>not fully mixed<\/b><\/td><\/tr><\/table><\/div>\n<p><b>Claims you can support:<\/b> particles move faster when heated; particle speed depends on temperature; the <b>rate of diffusion depends on temperature<\/b>.<\/p>\n<figure class=\"fig wide\"><svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 356 152\" role=\"img\" style=\"width:100%;max-width:534px;height:auto;background:transparent\"><g transform=\"translate(0,0)\"><rect x=\"0.8\" y=\"0.8\" width=\"168.4\" height=\"128.4\" fill=\"#fff\" stroke=\"#111\" stroke-width=\"2\"/><circle cx=\"20.6\" cy=\"29.3\" r=\"9\" fill=\"#111111\" stroke=\"#111\" stroke-width=\"1.6\"/><circle cx=\"109.3\" cy=\"31.8\" r=\"9\" fill=\"#111111\" stroke=\"#111\" stroke-width=\"1.6\"/><circle cx=\"49.6\" cy=\"88.7\" r=\"9\" fill=\"#111111\" stroke=\"#111\" stroke-width=\"1.6\"/><circle cx=\"116.8\" cy=\"79.9\" r=\"9\" fill=\"#111111\" stroke=\"#111\" stroke-width=\"1.6\"/><circle cx=\"89.7\" cy=\"60.2\" r=\"9\" fill=\"#111111\" stroke=\"#111\" stroke-width=\"1.6\"/><circle cx=\"150.5\" cy=\"27.6\" r=\"9\" fill=\"#111111\" stroke=\"#111\" stroke-width=\"1.6\"/><line x1=\"30.8\" y1=\"25.3\" x2=\"37.3\" y2=\"22.7\" stroke=\"#c0392b\" stroke-width=\"1.5\"/><polygon points=\"37.3,22.7 34.6,26.2 32.9,22.0\" fill=\"#c0392b\"/><line x1=\"100.3\" y1=\"38.1\" x2=\"94.5\" y2=\"42.1\" stroke=\"#c0392b\" stroke-width=\"1.5\"/><polygon points=\"94.5,42.1 96.4,38.0 99.0,41.7\" fill=\"#c0392b\"/><line x1=\"53.1\" y1=\"99.1\" x2=\"55.3\" y2=\"105.8\" stroke=\"#c0392b\" stroke-width=\"1.5\"/><polygon points=\"55.3,105.8 51.9,102.8 56.2,101.4\" fill=\"#c0392b\"/><line x1=\"111.4\" y1=\"89.5\" x2=\"108.1\" y2=\"95.7\" stroke=\"#c0392b\" stroke-width=\"1.5\"/><polygon points=\"108.1,95.7 108.0,91.2 111.9,93.4\" fill=\"#c0392b\"/><line x1=\"82.4\" y1=\"68.4\" x2=\"77.8\" y2=\"73.7\" stroke=\"#c0392b\" stroke-width=\"1.5\"/><polygon points=\"77.8,73.7 78.7,69.3 82.1,72.3\" fill=\"#c0392b\"/><line x1=\"161.1\" y1=\"24.5\" x2=\"167.8\" y2=\"22.6\" stroke=\"#c0392b\" stroke-width=\"1.5\"/><polygon points=\"167.8,22.6 164.7,25.8 163.4,21.5\" fill=\"#c0392b\"/><text x=\"85.0\" y=\"147\" text-anchor=\"middle\" font-family=\"Arial,sans-serif\" font-size=\"13\" font-weight=\"bold\" fill=\"#111\">Cold (slow)<\/text><\/g><g transform=\"translate(186,0)\"><rect x=\"0.8\" y=\"0.8\" width=\"168.4\" height=\"128.4\" fill=\"#fff\" stroke=\"#111\" stroke-width=\"2\"/><circle cx=\"29.2\" cy=\"38.7\" r=\"9\" fill=\"#111111\" stroke=\"#111\" stroke-width=\"1.6\"/><circle cx=\"137.8\" cy=\"64.7\" r=\"9\" fill=\"#111111\" stroke=\"#111\" stroke-width=\"1.6\"/><circle cx=\"32.2\" cy=\"65.8\" r=\"9\" fill=\"#111111\" stroke=\"#111\" stroke-width=\"1.6\"/><circle cx=\"88.0\" cy=\"105.9\" r=\"9\" fill=\"#111111\" stroke=\"#111\" stroke-width=\"1.6\"/><circle cx=\"68.0\" cy=\"19.1\" r=\"9\" fill=\"#111111\" stroke=\"#111\" stroke-width=\"1.6\"/><circle cx=\"115.5\" cy=\"96.5\" r=\"9\" fill=\"#111111\" stroke=\"#111\" stroke-width=\"1.6\"/><line x1=\"39.8\" y1=\"35.5\" x2=\"62.7\" y2=\"28.6\" stroke=\"#c0392b\" stroke-width=\"1.5\"/><polygon points=\"62.7,28.6 59.6,31.8 58.4,27.5\" fill=\"#c0392b\"/><line x1=\"141.1\" y1=\"75.2\" x2=\"148.3\" y2=\"98.1\" stroke=\"#c0392b\" stroke-width=\"1.5\"/><polygon points=\"148.3,98.1 145.0,95.0 149.3,93.7\" fill=\"#c0392b\"/><line x1=\"41.8\" y1=\"71.2\" x2=\"62.7\" y2=\"83.0\" stroke=\"#c0392b\" stroke-width=\"1.5\"/><polygon points=\"62.7,83.0 58.2,83.0 60.4,79.1\" fill=\"#c0392b\"/><line x1=\"96.0\" y1=\"113.5\" x2=\"113.4\" y2=\"130.0\" stroke=\"#c0392b\" stroke-width=\"1.5\"/><polygon points=\"113.4,130.0 109.0,128.9 112.1,125.7\" fill=\"#c0392b\"/><line x1=\"78.9\" y1=\"17.5\" x2=\"102.6\" y2=\"14.2\" stroke=\"#c0392b\" stroke-width=\"1.5\"/><polygon points=\"102.6,14.2 99.1,17.0 98.5,12.5\" fill=\"#c0392b\"/><line x1=\"123.8\" y1=\"103.7\" x2=\"142.1\" y2=\"119.2\" stroke=\"#c0392b\" stroke-width=\"1.5\"/><polygon points=\"142.1,119.2 137.7,118.4 140.6,114.9\" fill=\"#c0392b\"/><text x=\"85.0\" y=\"147\" text-anchor=\"middle\" font-family=\"Arial,sans-serif\" font-size=\"13\" font-weight=\"bold\" fill=\"#111\">Hot (fast)<\/text><\/g><\/svg><figcaption>Same particles at a lower and a higher temperature<\/figcaption><\/figure>\n<p><b>#7b answer idea:<\/b> the <b>hot water<\/b> has the higher average kinetic energy, because higher temperature means the particles are moving faster.<\/p>\n","checks":[{"q":"What does temperature measure?","o":["The size of the particles","The average kinetic energy of the particles","The total number of particles","The mass of the sample"],"a":1,"w":"Temperature = average KE (indirectly, particle speed)."},{"q":"In the food-dye demo, why did the dye diffuse faster in the warm water?","o":["The cold water had no particles","The warm water particles had higher average KE, so they moved faster and collided more","The warm water had more dye","The dye was heavier"],"a":1,"w":"Higher temperature = higher average KE = faster particles = faster mixing."},{"q":"Which flask has particles with the higher average kinetic energy?","o":["The 11 °C flask","The 50 °C flask","It cannot be determined","They are equal"],"a":1,"w":"The warmer water has the higher average kinetic energy."}]},{"id":"l2_4","title":"Thermal expansion","html":"\n<div class=\"box\"><b>Thermal expansion<\/b>: matter generally <b>expands when heated<\/b> and <b>contracts when cooled<\/b>.<\/div>\n<ul>\n<li>Air in a tire can get overheated and cause the tire to burst; air pressure drops when it is cold, which can turn on the check-tire-pressure light.<\/li>\n<li>Power lines <b>sag<\/b> in warm weather and get <b>very tight<\/b> in winter.<\/li>\n<li><b>Exception:<\/b> water is one of the few things that <b>expands when it gets colder<\/b> (because it is polar).<\/li>\n<\/ul>\n<p class=\"note\">Particle idea (standard chemistry): hotter particles move faster and push each other a little farther apart on average, so the substance takes up more space.<\/p>\n","checks":[{"q":"Why do power lines sag in summer and get tight in winter?","o":["The wire gets heavier in winter","Gravity changes with the seasons","Metal particles disappear in winter","Things generally expand when hotter and contract when cooler"],"a":3,"w":"This is thermal expansion."},{"q":"Which substance is a well-known exception that expands when it gets colder?","o":["Iron","Air","Water","Alcohol"],"a":2,"w":"Water expands as it cools toward freezing."}]}],"quiz":[{"q":"Which vocabulary terms should you use to explain how a scent travels across a room?","o":["Group, period, family","Atom, molecule, compound","Diffusion, random walk, elastic collisions","Filtration, evaporation, distillation"],"a":2,"w":"These are the key terms listed in review question #6."},{"q":"If temperature increases, the particles...","o":["move faster, so average kinetic energy increases","get larger","stop moving","move slower"],"a":0,"w":"Temperature measures average KE."},{"q":"Diffusion of dye is faster in hot water because...","o":["the dye is attracted to heat","hot water has fewer particles","hot water is a solid","the particles have higher average kinetic energy and collide more often"],"a":3,"w":"Faster particles spread out sooner."},{"q":"What is the formula for kinetic energy used in class?","o":["KE = v²","KE = m / v","KE = m + v","KE = ½ m v²"],"a":3,"w":"KE = ½mv²."},{"q":"Gas particles travel at hundreds of mph, yet diffusion is slow. The best explanation is...","o":["they only move in a straight line","frequent collisions change their direction so net movement is slow","they are attracted to each other","they are not moving"],"a":1,"w":"Random walk with many collisions."}]},{"id":"s3","num":3,"color":"#2ecc71","title":"Classifying Matter","tag":"Review packet #1 (pure substance, mixture, element, compound, heterogeneous, homogeneous, atom, molecule, diatomic) and #4, #10","intro":"Sort matter into pure substances and mixtures, then elements and compounds, and read particle diagrams.","lessons":[{"id":"l3_1","title":"The matter flowchart","html":"\n<div class=\"flow\">\n<div class=\"fr\"><div class=\"fb t\"><b>Solids<\/b>Strong attractions lock particles close together into a fixed, lattice arrangement.<\/div>\n<div class=\"fb t\"><b>Liquids<\/b>Particles constantly make and break temporary attractions and can slip past one another. Particles are close together.<\/div>\n<div class=\"fb t\"><b>Gases<\/b>Particles are independent and widely separated, with no attractive forces. They fill the volume of the container.<\/div><\/div>\n<div class=\"ar\">▼ matter exists as ▼<\/div>\n<div class=\"fr\"><div class=\"fb\" style=\"max-width:220px;border-width:3px\"><b>MATTER<\/b><\/div><\/div>\n<div class=\"ar\">▼ ▼<\/div>\n<div class=\"cols\">\n<div class=\"col\"><div class=\"fb p\" style=\"max-width:none\"><b>Pure substances<\/b>Fixed composition, one set of characteristic physical properties (density, mp, bp); can't be separated by physical means. At the particle level, all particles are identical.<\/div>\n<div class=\"ar\">▼<\/div>\n<div class=\"fr\"><div class=\"fb p\"><b>Elements<\/b>Can't be broken down into simpler substances by physical or chemical means. Smallest particle is an atom (7 are diatomic molecules).<\/div>\n<div class=\"fb p\"><b>Compounds<\/b>Two or more elements in fixed mass ratios; can be broken down by chemical means. Atoms combine in small whole-number ratios.<\/div><\/div><\/div>\n<div class=\"col\"><div class=\"fb m\" style=\"max-width:none\"><b>Mixtures<\/b>Variable composition; physical properties vary with the composition. At the particle level, there is more than one type of particle.<\/div>\n<div class=\"ar\">▼<\/div>\n<div class=\"fr\"><div class=\"fb m\"><b>Homogeneous<\/b>One phase only; uniform properties throughout the sample.<\/div>\n<div class=\"fb m\"><b>Heterogeneous<\/b>May exist in more than one phase; variable properties in different parts of the sample.<\/div><\/div><\/div>\n<\/div><\/div>\n<div class=\"tw\"><table class=\"tbl\"><tr><th>Pure substance<\/th><th>Mixture<\/th><\/tr>\n<tr><td>Only <b>1 type of particle<\/b>; all particles are identical<\/td><td><b>More than 1 type of particle<\/b><\/td><\/tr>\n<tr><td><b>Fixed composition<\/b>; one set of characteristic properties (density, melting point, boiling point)<\/td><td><b>Variable composition<\/b>; physical properties vary with the composition<\/td><\/tr>\n<tr><td><b>Cannot<\/b> be separated by physical means<\/td><td><b>Can<\/b> be separated by physical means<\/td><\/tr><\/table><\/div>\n<div class=\"box\"><b>Homogeneous<\/b> = exists in <b>one phase only<\/b> and has <b>uniform properties<\/b> throughout the sample.<br><b>Heterogeneous<\/b> = may exist in <b>more than one phase<\/b> and have <b>variable properties<\/b> in different parts of the sample.<\/div>\n<figure class=\"fig\"><svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 220 162\" role=\"img\" style=\"width:100%;max-width:330px;height:auto;background:transparent\"><g transform=\"translate(0,0)\"><rect x=\"0.8\" y=\"0.8\" width=\"218.4\" height=\"138.4\" fill=\"#fff\" stroke=\"#111\" stroke-width=\"2\"/><circle cx=\"21.0\" cy=\"120.9\" r=\"9\" fill=\"#ffffff\" stroke=\"#111\" stroke-width=\"1.6\"/><circle cx=\"41.7\" cy=\"119.2\" r=\"9\" fill=\"#ffffff\" stroke=\"#111\" stroke-width=\"1.6\"/><circle cx=\"62.4\" cy=\"120.3\" r=\"9\" fill=\"#111111\" stroke=\"#111\" stroke-width=\"1.6\"/><circle cx=\"81.8\" cy=\"118.5\" r=\"9\" fill=\"#ffffff\" stroke=\"#111\" stroke-width=\"1.6\"/><circle cx=\"98.7\" cy=\"121.3\" r=\"9\" fill=\"#111111\" stroke=\"#111\" stroke-width=\"1.6\"/><circle cx=\"121.3\" cy=\"120.9\" r=\"9\" fill=\"#ffffff\" stroke=\"#111\" stroke-widt ll=\"#111111\" stroke=\"#111\" stroke-width=\"1.6\"/><circle cx=\"69.2\" cy=\"99.5\" r=\"9\" fill=\"#111111\" stroke=\"#111\" stroke-width=\"1.6\"/><circle cx=\"88.7\" cy=\"99.5\" r=\"9\" fill=\"#111111\" stroke=\"#111\" stroke-width=\"1.6\"/><circle cx=\"30.2\" cy=\"80.0\" r=\"9\" fill=\"#111111\" stroke=\"#111\" stroke-width=\"1.6\"/><circle cx=\"49.7\" cy=\"80.0\" r=\"9\" fill=\"#111111\" stroke=\"#111\" stroke-width=\"1.6\"/><circle cx=\"69.2\" cy=\"80.0\" r=\"9\" fill=\"#111111\" stroke=\"#111\" stroke-width=\"1.6\"/><circle cx=\"88.7\" cy=\"80.0\" r=\"9\" fill=\"#111111\" stroke=\"#111\" stroke-width=\"1.6\"/><circle cx=\"30.2\" cy=\"60.5\" r=\"9\" fill=\"#111111\" stroke=\"#111\" stroke-width=\"1.6\"/><circle cx=\"49.7\" cy=\"60.5\" r=\"9\" fill=\"#111111\" stroke=\"#111\" stroke-width=\"1.6\"/><circle cx=\"69.2\" cy=\"60.5\" r=\"9\" fill=\"#111111\" stroke=\"#111\" stroke-width=\"1.6\"/><circle cx=\"88.7\" cy=\"60.5\" r=\"9\" fill=\"#111111\" stroke=\"#111\" stroke-width=\"1.6\"/><circle cx=\"134.8\" cy=\"118.8\" r=\"9\" fill=\"#ffffff\" stroke=\"#111\" stroke-width=\"1.6\"/><circle cx=\"154.9\" cy=\"119.0\" r=\"9\" fill=\"#ffffff\" stroke=\"#111\" stroke-width=\"1.6\"/><circle cx=\"173.2\" cy=\"119.9\" r=\"9\" fill=\"#ffffff\" stroke=\"#111\" stroke-width=\"1.6\"/><circle cx=\"195.8\" cy=\"121.3\" r=\"9\" fill=\"#ffffff\" stroke=\"#111\" stroke-width=\"1.6\"/><circle cx=\"146.5\" cy=\"101.1\" r=\"9\" fill=\"#ffffff\" stroke=\"#111\" stroke-width=\"1.6\"/><circle cx=\"165.1\" cy=\"101.3\" r=\"9\" fill=\"#ffffff\" stroke=\"#111\" stroke-width=\"1.6\"/><circle cx=\"183.3\" cy=\"100.7\" r=\"9\" fill=\"#ffffff\" stroke=\"#111\" stroke-width=\"1.6\"/><circle cx=\"137.3\" cy=\"85.2\" r=\"9\" fill=\"#ffffff\" stroke=\"#111\" stroke-width=\"1.6\"/><circle cx=\"156.4\" cy=\"85.1\" r=\"9\" fill=\"#ffffff\" stroke=\"#111\" stroke-width=\"1.6\"/><circle cx=\"173.6\" cy=\"83.3\" r=\"9\" fill=\"#ffffff\" stroke=\"#111\" stroke-width=\"1.6\"/><circle cx=\"194.7\" cy=\"84.8\" r=\"9\" fill=\"#ffffff\" stroke=\"#111\" stroke-width=\"1.6\"/><circle cx=\"146.8\" cy=\"67.2\" r=\"9\" fill=\"#ffffff\" stroke=\"#111\" stroke-width=\"1.6\"/><circle cx=\"163.5\" cy=\"66.2\" r=\"9\" fill=\"#ffffff\" stroke=\"#111\" stroke-width=\"1.6\"/><circle cx=\"185.1\" cy=\"65.9\" r=\"9\" fill=\"#ffffff\" stroke=\"#111\" stroke-width=\"1.6\"/><\/g><\/svg><figcaption>Heterogeneous mixture: different parts<\/figcaption><\/figure>\n","checks":[{"q":"A sample has a single set of characteristic properties and all of its particles are identical. It is a...","o":["solution only","pure substance","heterogeneous mixture","mixture"],"a":1,"w":"Pure substances have only one type of particle and one set of properties."},{"q":"Which describes a HETEROGENEOUS mixture?","o":["It has exactly one type of particle","It has uniform properties throughout","It has more than one phase and variable properties in different parts","It cannot be separated"],"a":2,"w":"Heterogeneous = not uniform; different parts look and behave differently."},{"q":"Which describes a HOMOGENEOUS sample?","o":["Always a compound","Always a solid","One phase with uniform properties throughout","Several visible layers"],"a":2,"w":"Homogeneous = uniform throughout."}]},{"id":"l3_2","title":"Atoms, molecules and \"particles\"","html":"\n<div class=\"box\"><b>Atom<\/b> – the smallest particle of an element with unique properties.<br><b>Molecule<\/b> – 2 or more atoms <b>chemically combined<\/b> (bonded together).<\/div>\n<ul>\n<li>A <b>\"particle\"<\/b> can be an <b>atom<\/b> <i>or<\/i> a <b>molecule<\/b>.<\/li>\n<li>You <b>can't have an atom of a compound<\/b> – a compound's smallest particle is a molecule.<\/li>\n<li>Atoms of the same color that are <b>touching<\/b> are bonded together into a molecule.<\/li>\n<\/ul>\n<p class=\"note\">Subscripts and + signs: remember to include a subscript when you write a chemical formula (H₂O, O₂, CO₂).<\/p>\n","checks":[{"q":"What is a molecule?","o":["Any mixture of atoms","A single atom","A particle smaller than an atom","2 or more atoms chemically combined"],"a":3,"w":"A molecule is two or more atoms bonded together."},{"q":"Can a \"particle\" be an atom? A molecule?","o":["Neither","Atom only","Molecule only","Yes to both: a particle can be either"],"a":3,"w":"A particle can be a single atom (e.g., Ne) or a molecule (e.g., H₂O)."}]},{"id":"l3_3","title":"Elements and diatomic elements","html":"\n<div class=\"box\"><b>Element<\/b> – a pure substance made of <b>only one type of atom<\/b>. All particles (atoms or molecules) are the same. Elements are <b>on the periodic table<\/b> and <b>cannot be broken down<\/b> into simpler substances by physical or chemical means. Shown by a single symbol (S, Na, Fe).<\/div>\n<p><b>How can an element have a molecule as its smallest particle?<\/b> Seven elements naturally exist as <b>pairs of identical atoms<\/b> bonded together – <b>diatomic elements<\/b> (\"di\" = 2). Both atoms are the same, so it is still an <b>element<\/b>, not a compound.<\/p>\n<div class=\"tw\"><table class=\"tbl\"><tr><th>Diatomic element<\/th><th>Formula<\/th><\/tr>\n<tr><td>Hydrogen<\/td><td>H₂<\/td><\/tr><tr><td>Nitrogen<\/td><td>N₂<\/td><\/tr><tr><td>Oxygen<\/td><td>O₂<\/td><\/tr><tr><td>Fluorine<\/td><td>F₂<\/td><\/tr><tr><td>Chlorine<\/td><td>Cl₂<\/td><\/tr><tr><td>Bromine<\/td><td>Br₂<\/td><\/tr><tr><td>Iodine<\/td><td>I₂<\/td><\/tr><\/table><\/div>\n<p>Remember: if hydrogen is not in a compound, it is always a molecule of H₂.<\/p>\n<p class=\"note\"><b>LEGO analogy:<\/b> an element is a pile of bricks that are all the exact same color and size. Even if you click two red bricks together, it is still just \"red\".<\/p>\n<figure class=\"fig\"><svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 220 162\" role=\"img\" style=\"width:100%;max-width:330px;height:auto;background:transparent\"><g transform=\"translate(0,0)\"><rect x=\"0.8\" y=\"0.8\" width=\"218.4\" height=\"138.4\" fill=\"#fff\" stroke=\"#111\" stroke-width=\"2\"/><circle cx=\"132.4\" cy=\"94.7\" r=\"9\" fill=\"#111111\" stroke=\"#111\" stroke-width=\"1.6\"/><circle cx=\"190.5\" cy=\"94.5\" r=\"9\" fill=\"#111111\" stroke=\"#111\" stroke-width=\"1.6\"/><circle cx=\"24.3\" cy=\"66.5\" r=\"9\" fill=\"#111111\" stroke=\"#111\" stroke-width=\"1.6\"/><circle cx=\"63.9\" cy=\"74.5\" r=\"9\" fill=\"#111111\" stroke=\"#111\" stroke-width=\"1.6\"/><circle cx=\"21.4\" cy=\"41.1\" r=\"9\" fill=\"#111111\" stroke=\"#111\" stroke-width=\"1.6\"/><circle cx=\"48.0\" cy=\"100.3\" r=\"9\" fill=\"#111111\" stroke=\"#111\" stroke-width=\"1.6\"/><circle cx=\"131.4\" cy=\"31.9\" r=\"9\" fill=\"#111111\" stroke=\"#111\" stroke-width=\"1.6\"/><\/g><\/svg><figcaption>Element: single atoms<\/figcaption><\/figure><figure class=\"fig\"><svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 220 162\" role=\"img\" style=\"width:100%;max-width:330px;height:auto;background:transparent\"><g transform=\"translate(0,0)\"><rect x=\"0.8\" y=\"0.8\" width=\"218.4\" height=\"138.4\" fill=\"#fff\" stroke=\"#111\" stroke-width=\"2\"/><circle cx=\"166.9\" cy=\"96.5\" r=\"9\" fill=\"#ffffff\" stroke=\"#111\" stroke-width=\"1.6\"/><circle cx=\"149.7\" cy=\"98.1\" r=\"9\" fill=\"#ffffff\" stroke=\"#111\" stroke-width=\"1.6\"/><circle cx=\"75.2\" cy=\"35.1\" r=\"9\" fill=\"#ffffff\" stroke=\"#111\" stroke-width=\"1.6\"/><circle cx=\"66.2\" cy=\"20.3\" r=\"9\" fill=\"#ffffff\" stroke=\"#111\" stroke-width=\"1.6\"/><circle cx=\"111.1\" cy=\"85.8\" r=\"9\" fill=\"#ffffff\" stroke=\"#111\" stroke-width=\"1.6\"/><circle cx=\"99.1\" cy=\"98.2\" r=\"9\" fill=\"#ffffff\" stroke=\"#111\" stroke-width=\"1.6\"/><circle cx=\"151.7\" cy=\"58.9\" r=\"9\" fill=\"#ffffff\" stroke=\"#111\" stroke-width=\"1.6\"/><circle cx=\"157.3\" cy=\"42.6\" r=\"9\" fill=\"#ffffff\" stroke=\"#111\" stroke-width=\"1.6\"/><circle cx=\"56.5\" cy=\"82.7\" r=\"9\" fill=\"#ffffff\" stroke=\"#111\" stroke-width=\"1.6\"/><circle cx=\"62.4\" cy=\"66.4\" r=\"9\" fill=\"#ffffff\" stroke=\"#111\" stroke-width=\"1.6\"/><\/g><\/svg><figcaption>Element: diatomic molecules<\/figcaption><\/figure>\n","checks":[{"q":"How can an element have a molecule as its smallest particle?","o":["It is a mixture","Elements can never have molecules","It contains two different atoms bonded together","It is a diatomic element: two identical atoms bonded together"],"a":3,"w":"O₂, N₂, etc. are elements because both atoms are the same."},{"q":"Which list contains ONLY diatomic elements?","o":["C, S, Fe","H₂, N₂, O₂, Cl₂","He, Ne, Ar","H₂O, CO₂, NaCl"],"a":1,"w":"The seven diatomic elements are H, N, O, F, Cl, Br, I."},{"q":"Elements are...","o":["always mixtures","made of two different atoms bonded together","listed on the periodic table","always compounds"],"a":2,"w":"Elements are on the periodic table."}]},{"id":"l3_4","title":"Compounds","html":"\n<div class=\"box\"><b>Compound<\/b> – a pure substance formed when <b>2 or more different elements are chemically bonded in a fixed ratio<\/b>, making a <b>new substance with a new (single) set of characteristic properties<\/b>. All the particles are identical.<\/div>\n<ul>\n<li><b>Fixed composition:<\/b> e.g., water is <b>always 2 to 1<\/b> (H₂O).<\/li>\n<li><b>New properties:<\/b> sodium + chlorine → table salt (NaCl) with only <b>ONE<\/b> color, <b>ONE<\/b> boiling point...<\/li>\n<li><b>Can't be separated by physical means<\/b> (filtering, evaporating, magnet). They can only be broken down by <b>chemical reactions<\/b>.<\/li>\n<\/ul>\n<p><b>How do you recognize a compound?<\/b> Its particles are all identical, and each one contains <b>different<\/b> atoms bonded (touching) together.<\/p>\n<figure class=\"fig\"><svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 220 162\" role=\"img\" style=\"width:100%;max-width:330px;height:auto;background:transparent\"><g transform=\"translate(0,0)\"><rect x=\"0.8\" y=\"0.8\" width=\"218.4\" height=\"138.4\" fill=\"#fff\" stroke=\"#111\" stroke-width=\"2\"/><circle cx=\"83.1\" cy=\"44.6\" r=\"9\" fill=\"#9b9b9b\" stroke=\"#111\" stroke-width=\"1.6\"/><circle cx=\"82.4\" cy=\"61.9\" r=\"9\" fill=\"#ffffff\" stroke=\"#111\" stroke-width=\"1.6\"/><circle cx=\"66.5\" cy=\"39.8\" r=\"9\" fill=\"#ffffff\" stroke=\"#111\" stroke-width=\"1.6\"/><circle cx=\"159.9\" cy=\"42.7\" r=\"9\" fill=\"#9b9b9b\" stroke=\"#111\" stroke-width=\"1.6\"/><circle cx=\"168.1\" cy=\"27.5\" r=\"9\" fill=\"#ffffff\" stroke=\"#111\" stroke-width=\"1.6\"/><circle cx=\"172.7\" cy=\"54.3\" r=\"9\" fill=\"#ffffff\" stroke=\"#111\" stroke-width=\"1.6\"/><circle cx=\"129.4\" cy=\"102.5\" r=\"9\" fill=\"#9b9b9b\" stroke=\"#111\" stroke-width=\"1.6\"/><circle cx=\"136.5\" cy=\"118.3\" r=\"9\" fill=\"#ffffff\" stroke=\"#111\" stroke-width=\"1.6\"/><circle cx=\"112.4\" cy=\"105.6\" r=\"9\" fill=\"#ffffff\" stroke=\"#111\" stroke-width=\"1.6\"/><circle cx=\"40.8\" cy=\"96.0\" r=\"9\" fill=\"#9b9b9b\" stroke=\"#111\" stroke-width=\"1.6\"/><circle cx=\"54.5\" cy=\"85.5\" r=\"9\" fill=\"#ffffff\" stroke=\"#111\" stroke-width=\"1.6\"/><circle cx=\"47.8\" cy=\"111.9\" r=\"9\" fill=\"#ffffff\" stroke=\"#111\" stroke-width=\"1.6\"/><circle cx=\"184.8\" cy=\"94.1\" r=\"9\" fill=\"#9b9b9b\" stroke=\"#111\" stroke-width=\"1.6\"/><circle cx=\"186.6\" cy=\"77.0\" r=\"9\" fill=\"#ffffff\" stroke=\"#111\" stroke-width=\"1.6\"/><circle cx=\"201.0\" cy=\"100.1\" r=\"9\" fill=\"#ffffff\" stroke=\"#111\" stroke-width=\"1.6\"/><\/g><\/svg><figcaption>Compound: identical molecules made of different atoms<\/figcaption><\/figure>\n<p class=\"note\"><b>Element vs. compound:<\/b> an element is a pure substance made of only one type of atom; a compound is a pure substance made of two or more different elements chemically bonded.<\/p>\n","checks":[{"q":"Which is a defining feature of a compound?","o":["Different elements chemically bonded in a fixed ratio","Different substances physically mixed in any ratio","It can be separated with a filter","Only one type of atom"],"a":0,"w":"Fixed ratio + chemical bonding."},{"q":"In water (H₂O), the ratio of hydrogen to oxygen is...","o":["3 to 1","1 to 2","always 2 to 1","variable"],"a":2,"w":"Fixed composition: 2 H to 1 O."},{"q":"Why can you NOT separate a compound by filtering or evaporating?","o":["It has variable composition","Its elements are chemically bonded, so it can only be broken down by chemical reactions","It is always a gas","It has no particles"],"a":1,"w":"Compounds are chemically bonded; physical methods don't break bonds."}]},{"id":"l3_5","title":"Reading particle diagrams","html":"\n<p>In the class diagrams, each <b>circle<\/b> is an atom and each <b>different color<\/b> is a different element. <b>Touching circles<\/b> are bonded together.<\/p>\n<div class=\"box\"><b>Three questions to classify any container:<\/b><ol>\n<li><b>Are ALL the particles identical?<\/b> Yes → <b>pure substance<\/b>. No → <b>mixture<\/b>.<\/li>\n<li><b>If pure:<\/b> only one color of atom (single atoms or identical molecules like O₂) → <b>element<\/b>. Touching atoms of different colors → <b>compound<\/b>.<\/li>\n<li><b>If a mixture:<\/b> what is mixed? <b>Mixture of elements<\/b>, <b>mixture of compounds<\/b>, or <b>mixture of elements and compounds<\/b>.<\/li>\n<\/ol><\/div>\n<figure class=\"fig\"><svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 220 162\" role=\"img\" style=\"width:100%;max-width:330px;height:auto;background:transparent\"><g transform=\"translate(0,0)\"><rect x=\"0.8\" y=\"0.8\" width=\"218.4\" height=\"138.4\" fill=\"#fff\" stroke=\"#111\" stroke-width=\"2\"/><circle cx=\"132.4\" cy=\"94.7\" r=\"9\" fill=\"#111111\" stroke=\"#111\" stroke-width=\"1.6\"/><circle cx=\"190.5\" cy=\"94.5\" r=\"9\" fill=\"#111111\" stroke=\"#111\" stroke-width=\"1.6\"/><circle cx=\"24.3\" cy=\"66.5\" r=\"9\" fill=\"#111111\" stroke=\"#111\" stroke-width=\"1.6\"/><circle cx=\"63.9\" cy=\"74.5\" r=\"9\" fill=\"#111111\" stroke=\"#111\" stroke-width=\"1.6\"/><circle cx=\"21.4\" cy=\"41.1\" r=\"9\" fill=\"#111111\" stroke=\"#111\" stroke-width
